# Bright multicolour light system — blueprint §3.2 / §123 (no pink / violet, no dark UI).
# Neutral cream surfaces; each knowledge type gets its own distinct hue.
# primaryColor / linkColor are one shade deeper so they stay >= 4.5:1 on the
# multicolour background blobs too (app/ui/theme.py BLOB_STRENGTH).
# Every *TextColor is an "ink": >= 4.5:1 on canvas, white, soft and its own 10% tint.
# tests/unit/test_theme_contrast.py enforces this — re-run tests after changing a colour.

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#9D5309"
backgroundColor = "#FFFCF5"
secondaryBackgroundColor = "#F6F3EA"
textColor = "#2B2A27"
linkColor = "#1A6CA0"
borderColor = "#E4DDCF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
codeBackgroundColor = "#FFFFFF"
codeTextColor = "#2B2A27"
dataframeHeaderBackgroundColor = "#F6F3EA"

font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 16
codeFontSize = "0.9rem"
headingFontWeights = [700, 700, 600, 600, 600, 600]

redColor = "#E0524A"
redBackgroundColor = "#F7F6F2"
redTextColor = "#D12D24"
orangeColor = "#F28C28"
orangeBackgroundColor = "#FEF4EA"
orangeTextColor = "#A7580A"
yellowColor = "#F4B400"
yellowBackgroundColor = "#FEF8E6"
yellowTextColor = "#8B6700"
greenColor = "#3FAE6A"
greenBackgroundColor = "#ECF7F0"
greenTextColor = "#2D7B4B"
blueColor = "#3AA0E0"
blueBackgroundColor = "#EBF6FC"
blueTextColor = "#1B73AB"
# Streamlit's "violet" slot is re-coloured lime so nothing purple can appear.
violetColor = "#7CB518"
violetBackgroundColor = "#F2F8E8"
violetTextColor = "#527810"
grayColor = "#6B665C"
grayTextColor = "#6B665C"

chartCategoricalColors = ["#F28C28", "#3AA0E0", "#3FAE6A", "#7CB518", "#F4B400", "#1FA5A0", "#3B7DDD", "#E0524A"]

[theme.sidebar]
backgroundColor = "#F6F3EA"
secondaryBackgroundColor = "#FFFFFF"
