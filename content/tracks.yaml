  - {id: visualization, order: 18, code: "18", icon: ":material/insert_chart:", title_ar: "تصوير البيانات", title_en: "Data Visualization", summary_ar: "من السؤال إلى الرسم: Matplotlib ثم Seaborn/Plotly/Altair."}
  - {id: databases, order: 19, code: "19", icon: ":material/database:", title_ar: "قواعد البيانات", title_en: "Databases", summary_ar: "SQL، sqlite3، SQLAlchemy، DuckDB."}
