# The 25 tracks of blueprint §3.4. A track appears in the sidebar once it has lessons.
tracks:
  - {id: before_python, order: 0, code: "00", icon: ":material/computer:", title_ar: "ما قبل Python", title_en: "Before Python", summary_ar: "البرنامج، الـprocess، الملفات والمسارات، والـterminal."}
  - {id: environment, order: 1, code: "01", icon: ":material/deployed_code:", title_ar: "بيئة Python", title_en: "Python Environment", summary_ar: "الـinterpreter، البيئات الافتراضية، pip وuv، وJupyter kernel."}
  - {id: syntax, order: 2, code: "02", icon: ":material/data_object:", title_ar: "أساسيات الصياغة", title_en: "Syntax Foundations", summary_ar: "tokens، expressions وstatements، الإزاحة، النصوص والتعليقات."}
  - {id: data_types, order: 3, code: "03", icon: ":material/category:", title_ar: "أنواع البيانات", title_en: "Data Types", summary_ar: "الأسماء والـobjects، الأرقام، النصوص، lists وdicts وsets."}
