  - {id: web, order: 21, code: "21", icon: ":material/public:", title_ar: "بيانات الويب والـAPI", title_en: "Web/API Data", summary_ar: "HTTP، requests، JSON، HTML وBeautiful Soup."}
  - {id: advanced, order: 22, code: "22", icon: ":material/rocket_launch:", title_ar: "Python المتقدم", title_en: "Advanced Python", summary_ar: "copying، hashability، protocols، async، الذاكرة."}
  - {id: packaging, order: 23, code: "23", icon: ":material/package_2:", title_ar: "الحزم والمشاريع", title_en: "Packaging & Projects", summary_ar: "pyproject.toml، src layout، النشر، Git، CLI."}
  - {id: capstone, order: 24, code: "24", icon: ":material/emoji_events:", title_ar: "المشاريع الختامية", title_en: "Capstone Labs", summary_ar: "مشاريع تجمع كل ما سبق في سياق بحثي."}
