  - {id: stdlib, order: 14, code: "14", icon: ":material/library_books:", title_ar: "المكتبة القياسية", title_en: "Standard Library", summary_ar: "خريطة الـmodules حسب المهمة: collections، datetime، logging…"}
  - {id: quality, order: 15, code: "15", icon: ":material/verified:", title_ar: "جودة الكود والاختبار", title_en: "Code Quality & Testing", summary_ar: "Ruff، typing، pytest، logging، profiling."}
