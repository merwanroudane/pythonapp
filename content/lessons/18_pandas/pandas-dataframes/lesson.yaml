id: pandas-dataframes
track: pandas
order: 1
title_ar: "pandas: الجداول DataFrame من القراءة إلى التلخيص"
title_en: "pandas: DataFrames from loading to summarising"
level: intermediate
estimated_minutes: 55
prerequisites: [numpy-arrays]
objectives:
  - "فهم Series (عمود له index) وDataFrame (جدول أعمدة له index مشترك)."
  - "إنشاء جدول من قاموس أو من CSV، وفحصه بـhead وshape وdtypes وdescribe."
  - "الاختيار بـ[] و.loc (بالتسمية) و.iloc (بالموضع)، والتصفية بشروط."
  - "إضافة أعمدة محسوبة، ومعالجة القيم المفقودة."
  - "التجميع بـgroupby و.agg، والترتيب."
docs_url: "https://pandas.pydata.org/docs/user_guide/10min.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [pandas, DataFrame, Series, index, loc, iloc, filter, groupby, agg, missing values, read_csv]

quizzes:
  q-loc-iloc:
    kind: predict
    question: "الـindex هنا أسماء المدن. ماذا يطبع؟"
    code: |
      import pandas as pd
      df = pd.DataFrame({"pop": [3.0, 1.6, 0.7]}, index=["Algiers", "Oran", "Setif"])
      print(df.loc["Oran", "pop"], df.iloc[0, 0])
    options: ["`1.6 3.0`", "`3.0 1.6`", "`KeyError`"]
    answer: 0
    explanation: |
      `.loc` يختار **بالتسمية** (label): الصف "Oran". و`.iloc` **بالموضع**: الصف الأول (رقم 0) وهو Algiers.
  q-filter:
    kind: concept
    question: "كيف تختار الصفوف التي عمرها 18 أو أكثر **و** مدينتها Oran؟"
    options:
      - "`df[df.age >= 18 and df.city == \"Oran\"]`"
      - "`df[(df[\"age\"] >= 18) & (df[\"city\"] == \"Oran\")]`"
      - "`df.loc[age >= 18, city == \"Oran\"]`"
    answer: 1
    explanation: |
      كل شرط يُنتج **Series منطقية**، وتجمعها بـ`&` (و) أو `|` (أو)، مع **أقواس** حول كل شرط. `and`
      لا تعمل مع الأعمدة.
  q-exit:
    kind: exit
    question: "ماذا يفعل `df.groupby(\"city\")[\"income\"].mean()`؟"
    options:
      - "يرتب الجدول حسب المدينة"
      - "يقسم الصفوف حسب المدينة، يحسب متوسط الدخل لكل مجموعة، ويجمع النتائج في Series"
      - "يحذف المدن المكررة"
    answer: 1
    explanation: "هذا نمط **split → apply → combine**، قلب تحليل البيانات الجدولية."

exercises:
  ex-survey:
    title: "حلّل استبيانًا صغيرًا"
    prompt: |
      من الجدول `df` أنشئ:

      - `adults`: الصفوف التي `age >= 18` فقط.
      - `mean_income`: Series بمتوسط `income` لكل `city` من `adults`، **مرتبة تنازليًا**.
      - `n_missing`: عدد القيم المفقودة في العمود `income` في الجدول الأصلي.
      - `df["income_k"]`: عمود جديد في `df` = income / 1000.
    starter: |
      import pandas as pd

      df = pd.DataFrame({
          "name": ["Sara", "Omar", "Lina", "Adam", "Yasmine", "Rami"],
          "age": [30, 17, 45, 22, 38, 51],
          "city": ["Oran", "Algiers", "Oran", "Setif", "Algiers", "Oran"],
          "income": [42000, None, 58000, 31000, 47000, 61000],
      })

      adults = ...
      mean_income = ...
      n_missing = ...

      print(adults, mean_income, n_missing, sep="\n\n")
    solution: |
      import pandas as pd

      df = pd.DataFrame({
          "name": ["Sara", "Omar", "Lina", "Adam", "Yasmine", "Rami"],
          "age": [30, 17, 45, 22, 38, 51],
          "city": ["Oran", "Algiers", "Oran", "Setif", "Algiers", "Oran"],
          "income": [42000, None, 58000, 31000, 47000, 61000],
      })

      adults = df[df["age"] >= 18]
      mean_income = adults.groupby("city")["income"].mean().sort_values(ascending=False)
      n_missing = int(df["income"].isna().sum())
      df["income_k"] = df["income"] / 1000

      print(adults, mean_income, n_missing, sep="\n\n")
    tests: |
      import math as _m
      assert list(adults["name"]) == ["Sara", "Lina", "Adam", "Yasmine", "Rami"], "adults غير صحيح"
      assert list(mean_income.index) == ["Oran", "Algiers", "Setif"], f"الترتيب غير صحيح: {list(mean_income.index)}"
      assert _m.isclose(mean_income["Oran"], (42000 + 58000 + 61000) / 3)
      assert n_missing == 1, f"n_missing يجب أن يكون 1 وليس {n_missing}"
      assert "income_k" in df.columns and _m.isclose(df.loc[0, "income_k"], 42.0), "أضف العمود income_k إلى df"
    hints:
      - "التصفية: `df[df[\"age\"] >= 18]`. والقيم المفقودة: `df[\"income\"].isna().sum()`."
      - "`adults.groupby(\"city\")[\"income\"].mean()` ثم `.sort_values(ascending=False)`."
      - "عمود جديد: `df[\"income_k\"] = df[\"income\"] / 1000`"

# --- step-by-step command animations ---
animations:
  anim-pandas:
    title: جدول واحد، خمسة أوامر pandas
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "city": ["Oran", "Algiers", "Oran", "Setif"],
          "income": [42000, 38000, 58000, None],
      })
      df["income_k"] = df["income"] / 1000
      rich = df[df["income"] > 40000]
      missing = df["income"].isna().sum()
      groups = df.groupby("city")["income"].mean()
      ranked = groups.sort_values(ascending=False)
      print(ranked)
    notes:
      3:
        what: 'من قاموس إلى جدول: كل مفتاح يصبح **عمودًا**، وكل قائمة قيم ذلك العمود، ويُضاف **index** تلقائي: 0، 1، 2، 3.'
        parts:
        - ['pd.DataFrame({...})', بناء جدول من dict of lists]
        - [None, قيمة مفقودة؛ تصبح `NaN` في عمود رقمي]
        theory: الـDataFrame مجموعة **أعمدة**، كل عمود Series بنوع واحد، وكلها تتشارك index واحدًا. لذلك نفكر في pandas **عمودًا عمودًا** لا صفًا صفًا. ولاحظ أن `income` صار `float64` لأن `NaN` نفسها قيمة float.
      7:
        what: 'عمود جديد محسوب: القسمة تُطبَّق على العمود كله دفعة واحدة (vectorized)، و`NaN / 1000` تبقى `NaN`.'
        parts:
        - ['df["income_k"] =', الإسناد إلى عمود غير موجود **ينشئه**]
        - ['df["income"] / 1000', Series ÷ رقم ← Series جديدة بالطول نفسه]
      8:
        what: 'التصفية على مرحلتين: الشرط ينتج Series منطقية، ثم `df[...]` يُبقي الصفوف التي قيمتها `True`.'
        parts:
        - ['df["income"] > 40000', True/False لكل صف (و`NaN > 40000` تعطي False)]
        - ['df[mask]', اختيار الصفوف حيث True]
        theory: 'الـindex الأصلي **يبقى** (0 و2): إنه هوية الصف لا رقم ترتيبه، وهذا ما يسمح بمحاذاة الجداول ودمجها لاحقًا. استخدم `reset_index(drop=True)` إن أردت ترقيمًا جديدًا.'
      9:
        what: '`isna()` تعطي True للقيم المفقودة، و`sum()` تعدّها: قيمة واحدة هنا.'
      10:
        what: '**split → apply → combine**: نقسم الصفوف حسب المدينة، نحسب متوسط الدخل في كل مجموعة، ونجمع النتائج في Series index-ها أسماء المدن.'
        parts:
        - [groupby("city"), 'split: مجموعة لكل قيمة مختلفة من `city`']
        - ['["income"]', العمود الذي نلخّصه]
        - [.mean(), 'apply + combine: متوسط كل مجموعة']
        theory: 'Setif متوسطها `NaN` لأن قيمتها الوحيدة مفقودة: دوال التجميع **تتجاهل** `NaN`، فإن لم يبقَ شيء كانت النتيجة مفقودة. والمجموعات مرتبة أبجديًا افتراضيًا.'
      11:
        what: '`sort_values(ascending=False)` ترتيب تنازلي حسب القيم، والـ`NaN` توضع في النهاية دائمًا.'
