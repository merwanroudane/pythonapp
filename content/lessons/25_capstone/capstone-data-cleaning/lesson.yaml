  - "تطبيق سير عمل بحثي كامل: قراءة، فحص، تنظيف، تحقق، تلخيص، رسم، تصدير."
  - "كتابة دوال تنظيف صغيرة قابلة للاختبار بدل خلايا متفرقة."
  - "توحيد النصوص، تحويل الأنواع، معالجة القيم المستحيلة والمفقودة والمكررة."
  - "توثيق كل قرار تنظيف في سجل (log) لأجل الشفافية."
