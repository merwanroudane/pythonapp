quizzes:
  q-raw:
    kind: concept
    question: "وجدت أخطاء في ملف البيانات الخام. ما الممارسة الصحيحة؟"
    options:
      - "تصحيحها يدويًا في Excel وحفظ الملف فوق الأصلي"
      - "ترك الملف الخام كما هو، وكتابة التصحيحات في كود يُنتج ملفًا جديدًا نظيفًا"
      - "حذف الصفوف التي فيها أخطاء دون تسجيل"
    answer: 1
    explanation: |
      الخام **للقراءة فقط**. كل تعديل في كود يمكن مراجعته وإعادة تشغيله، وكل حذف يُسجَّل بعدده وسببه.
      هكذا يمكن لأي شخص، ولك بعد سنة، أن يعيد الوصول إلى النتائج نفسها.
  q-missing:
    kind: concept
    question: "العمر `-3` في صف ما. ماذا تفعل غالبًا؟"
    options:
      - "تحوّله إلى 3"
      - "تعتبره قيمة مستحيلة، تجعله مفقودًا (NaN)، وتسجّل ذلك"
      - "تحذف العمود كله"
    answer: 1
    explanation: "لا تخمّن القيمة الصحيحة. القيم المستحيلة تصبح مفقودة، وتُعالج المفقودات لاحقًا بقرار صريح وموثَّق."
  q-exit:
    kind: exit
    question: "لماذا نكتب التنظيف كدوال صغيرة (`clean_city`، `clean_age`…) لا كسطر طويل واحد؟"
    options:
      - "لأن pandas تفرض ذلك"
      - "لأن كل دالة يمكن اختبارها وحدها، وإعادة استخدامها، وقراءة نيتها من اسمها"
      - "لأنها أسرع دائمًا"
    answer: 1
    explanation: "دوال صغيرة باختبارات = ثقة. عندما تصل بيانات جديدة بشكل مختلف قليلًا، يخبرك اختبار فاشل بدل نتيجة خاطئة صامتة."

exercises:
  ex-pipeline:
    title: "خط تنظيف كامل"
    prompt: |
      اكتب `clean(raw)` تأخذ DataFrame خامًا (أعمدة `id, age, city, income, date`) وتُعيد **جدولًا جديدًا** (لا
      تعدّل `raw`) بحيث:

      1. `city`: بلا مسافات زائدة وبصيغة Title Case (`" oran "` تصبح `"Oran"`)، وتوحّد `"Alger"` إلى
         `"Algiers"`.
      2. `age`: رقم (`pd.to_numeric(..., errors="coerce")`)، والقيم خارج 0 إلى 120 تصبح مفقودة.
      3. `income`: تُزال الفواصل (`"42,000"` تصبح `42000`) وتُحوَّل إلى رقم.
      4. `date`: تُحوَّل إلى تاريخ بالصيغة `%Y-%m-%d` (`errors="coerce"`).
      5. تُحذف الصفوف المكررة حسب `id` (يبقى الأول)، ثم يُعاد ترقيم الـindex (`reset_index(drop=True)`).
    starter: |
      import pandas as pd

      raw = pd.DataFrame({
          "id": [1, 2, 3, 3, 4, 5],
          "age": ["34", "n/a", "29", "29", "-3", "151"],
          "city": [" oran ", "ALGIERS", "Alger", "Alger", "setif", "Oran"],
          "income": ["42,000", "38000", "", "", "51,500", "47,250"],
          "date": ["2024-03-01", "2024-03-02", "2024-13-40", "2024-13-40", "2024-03-05", "2024-03-06"],
      })


      def clean(raw):
          df = raw
          return df


      tidy = clean(raw)
      print(tidy)
    solution: |
      import pandas as pd

      raw = pd.DataFrame({
          "id": [1, 2, 3, 3, 4, 5],
          "age": ["34", "n/a", "29", "29", "-3", "151"],
          "city": [" oran ", "ALGIERS", "Alger", "Alger", "setif", "Oran"],
          "income": ["42,000", "38000", "", "", "51,500", "47,250"],
          "date": ["2024-03-01", "2024-03-02", "2024-13-40", "2024-13-40", "2024-03-05", "2024-03-06"],
      })


      def clean(raw):
          df = raw.copy()
          df["city"] = df["city"].str.strip().str.title().replace({"Alger": "Algiers"})
          age = pd.to_numeric(df["age"], errors="coerce")
          df["age"] = age.where(age.between(0, 120))
          df["income"] = pd.to_numeric(df["income"].str.replace(",", "", regex=False), errors="coerce")
          df["date"] = pd.to_datetime(df["date"], format="%Y-%m-%d", errors="coerce")
          return df.drop_duplicates(subset="id", keep="first").reset_index(drop=True)


      tidy = clean(raw)
      print(tidy)
    tests: |
      import math as _m
      assert raw["city"].iloc[0] == " oran ", "لا تعدّل raw: اعمل على نسخة raw.copy()"
      _t = clean(raw)
      assert list(_t["id"]) == [1, 2, 3, 4, 5], f"احذف المكرر حسب id وأعد ترقيم الـindex: {list(_t['id'])}"
      assert list(_t.index) == [0, 1, 2, 3, 4], "استخدم reset_index(drop=True)"
      assert list(_t["city"]) == ["Oran", "Algiers", "Algiers", "Setif", "Oran"], f"city: {list(_t['city'])}"
      _ages = list(_t["age"])
      assert _ages[0] == 34 and _ages[2] == 29 and all(_m.isnan(_ages[i]) for i in (1, 3, 4)), f"age: {_ages}"
      _inc = list(_t["income"])
      assert _inc[0] == 42000 and _inc[3] == 51500 and _m.isnan(_inc[2]), f"income: {_inc}"
      assert str(_t["date"].dtype).startswith("datetime64"), f"date يجب أن يكون تاريخًا لا {_t['date'].dtype}"
      assert _t["date"].isna().tolist() == [False, False, True, False, False], "التاريخ المستحيل يصبح NaT"
    hints:
      - "ابدأ بـ`df = raw.copy()`. للنصوص: `.str.strip().str.title()` ثم `.replace({\"Alger\": \"Algiers\"})`."
      - "`age = pd.to_numeric(df[\"age\"], errors=\"coerce\")` ثم `age.where(age.between(0, 120))`."
      - "`df[\"income\"].str.replace(\",\", \"\", regex=False)` ثم `pd.to_numeric(..., errors=\"coerce\")`، والتاريخ `pd.to_datetime(..., format=\"%Y-%m-%d\", errors=\"coerce\")`، وأخيرًا `drop_duplicates(subset=\"id\").reset_index(drop=True)`."
