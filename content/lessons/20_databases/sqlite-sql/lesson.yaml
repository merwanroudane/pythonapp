id: sqlite-sql
track: databases
order: 1
title_ar: "قواعد البيانات وSQL مع sqlite3"
title_en: "Databases and SQL with sqlite3"
level: intermediate
estimated_minutes: 50
prerequisites: [pandas-dataframes]
objectives:
  - "فهم قاعدة البيانات العلائقية: جداول، صفوف، أعمدة، مفتاح أساسي، ومفتاح أجنبي."
  - "كتابة CREATE وINSERT وSELECT مع WHERE وORDER BY وGROUP BY وJOIN."
  - "استخدام sqlite3 من Python: connect وexecute وfetchall وcommit."
  - "استعمال الاستعلامات ذات المعاملات (?) لتجنب SQL injection."
  - "نقل النتائج إلى pandas بـread_sql_query."
docs_url: "https://docs.python.org/3/library/sqlite3.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [SQL, sqlite3, database, SELECT, JOIN, GROUP BY, primary key, SQL injection, parameters]

quizzes:
  q-where-having:
    kind: concept
    question: "تريد المدن التي **متوسط** دخلها فوق 50,000. أين يوضع هذا الشرط؟"
    options: ["`WHERE AVG(income) > 50000`", "`HAVING AVG(income) > 50000` بعد `GROUP BY city`", "`ORDER BY AVG(income) > 50000`"]
    answer: 1
    explanation: |
      `WHERE` يصفّي **الصفوف** قبل التجميع، و`HAVING` يصفّي **المجموعات** بعد `GROUP BY`. الشرط على
      دالة تجميع (`AVG`، `COUNT`…) مكانه `HAVING`.
  q-injection:
    kind: concept
    question: "أي سطر آمن مع اسم يُدخله المستخدم `name`؟"
    options:
      - "`cur.execute(f\"SELECT * FROM users WHERE name = '{name}'\")`"
      - "`cur.execute(\"SELECT * FROM users WHERE name = ?\", (name,))`"
      - "`cur.execute(\"SELECT * FROM users WHERE name = \" + name)`"
    answer: 1
    explanation: |
      مع `?` يُمرَّر الاسم **كقيمة** منفصلة عن نص الاستعلام، فلا يمكن أن يُفسَّر كجزء من SQL. أما
      تركيب النص بـf-string أو `+` فيسمح لمدخل مثل `x' OR '1'='1` بتغيير معنى الاستعلام.
  q-exit:
    kind: exit
    question: "ما وظيفة المفتاح الأجنبي `country_id` في جدول `cities`؟"
    options:
      - "يجعل البحث أسرع فقط"
      - "يربط كل مدينة بصف في جدول `countries`، فتُخزَّن معلومات الدولة مرة واحدة ويُربط بها بـJOIN"
      - "يمنع تكرار أسماء المدن"
    answer: 1
    explanation: "هذا جوهر التصميم العلائقي: لا تكرر البيانات، بل اربط الجداول بالمفاتيح واجمعها عند الحاجة بـJOIN."

exercises:
  ex-sales:
    title: "استعلامات على قاعدة مبيعات"
    prompt: |
      القاعدة `con` فيها جدولان: `products(id, name, category)` و`sales(product_id, qty, price)`.
      اكتب نص استعلامَين SQL ثم نفّذهما:

      - `q_total`: لكل `category`: مجموع الإيراد `SUM(qty * price)` باسم `revenue`، **مرتب تنازليًا**.
        خزّن النتيجة (قائمة tuples) في `totals`.
      - `q_big`: أسماء المنتجات التي بيع منها **أكثر من 5 وحدات** إجمالًا، مرتبة أبجديًا. خزّن النتيجة في
        `big` كقائمة أسماء (نصوص).
    starter: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
      CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, category TEXT);
      CREATE TABLE sales (product_id INTEGER REFERENCES products(id), qty INTEGER, price REAL);
      INSERT INTO products VALUES (1, 'pen', 'office'), (2, 'paper', 'office'),
                                  (3, 'tea', 'food'), (4, 'dates', 'food');
      INSERT INTO sales VALUES (1, 4, 50), (1, 3, 50), (2, 2, 400),
                               (3, 6, 120), (4, 1, 900), (4, 2, 900);
      """)

      q_total = """
      SELECT ...
      """
      totals = con.execute(q_total).fetchall()

      q_big = """
      SELECT ...
      """
      big = [row[0] for row in con.execute(q_big)]
      print(totals, big)
    solution: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
      CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, category TEXT);
      CREATE TABLE sales (product_id INTEGER REFERENCES products(id), qty INTEGER, price REAL);
      INSERT INTO products VALUES (1, 'pen', 'office'), (2, 'paper', 'office'),
                                  (3, 'tea', 'food'), (4, 'dates', 'food');
      INSERT INTO sales VALUES (1, 4, 50), (1, 3, 50), (2, 2, 400),
                               (3, 6, 120), (4, 1, 900), (4, 2, 900);
      """)

      q_total = """
      SELECT p.category, SUM(s.qty * s.price) AS revenue
      FROM sales AS s
      JOIN products AS p ON p.id = s.product_id
      GROUP BY p.category
      ORDER BY revenue DESC
      """
      totals = con.execute(q_total).fetchall()

      q_big = """
      SELECT p.name
      FROM sales AS s
      JOIN products AS p ON p.id = s.product_id
      GROUP BY p.name
      HAVING SUM(s.qty) > 5
      ORDER BY p.name
      """
      big = [row[0] for row in con.execute(q_big)]
      print(totals, big)
    tests: |
      assert totals == [("food", 3420.0), ("office", 1150.0)], f"totals غير صحيح: {totals}"
      assert big == ["pen", "tea"], f"big غير صحيح: {big}"
    hints:
      - "اربط الجدولين: `FROM sales AS s JOIN products AS p ON p.id = s.product_id`."
      - "الإيراد: `SELECT p.category, SUM(s.qty * s.price) AS revenue ... GROUP BY p.category ORDER BY revenue DESC`."
      - "الشرط على المجموع مكانه `HAVING SUM(s.qty) > 5` بعد `GROUP BY p.name`."

# --- step-by-step command animations ---
animations:
  anim-sql:
    title: 'من الاتصال إلى النتيجة: رحلة استعلام SQL'
    code: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE cities (name TEXT, country TEXT, pop REAL)")
      rows = [("Algiers", "DZ", 3.0), ("Oran", "DZ", 1.6), ("Tunis", "TN", 0.7)]
      con.executemany("INSERT INTO cities VALUES (?, ?, ?)", rows)
      con.commit()
      cur = con.execute("SELECT name, pop FROM cities WHERE pop > ? ORDER BY pop DESC", (1,))
      big = cur.fetchall()
      totals = con.execute("SELECT country, SUM(pop) FROM cities GROUP BY country").fetchall()
      print(big, totals)
    notes:
      3:
        what: نفتح **اتصالًا** بقاعدة بيانات. `":memory:"` قاعدة مؤقتة في الذاكرة تختفي بانتهاء البرنامج؛ واسم ملف مثل `"data.db"` يحفظها على القرص.
        theory: 'SQLite محرك قاعدة بيانات كامل **داخل مكتبة**، بلا خادم: القاعدة كلها ملف واحد. أما PostgreSQL وMySQL فخوادم تتصل بها عبر الشبكة، لكن واجهة Python متشابهة (معيار DB-API: `connect`، `execute`، `fetchall`، `commit`).'
      4:
        what: '`CREATE TABLE` يعرّف **مخطط (schema)** الجدول: اسمه وأعمدته ونوع كل عمود.'
        parts:
        - [CREATE TABLE cities, أنشئ جدولًا اسمه `cities`]
        - [name TEXT, عمود نصي]
        - [pop REAL, عمود عددي عشري]
      5:
        what: 'البيانات في Python: قائمة tuples، كل tuple صف واحد بترتيب الأعمدة.'
      6:
        what: '`executemany` تنفّذ الأمر نفسه لكل tuple. وعلامات `?` أماكن تملؤها المكتبة بالقيم بأمان.'
        parts:
        - [INSERT INTO cities VALUES, أدخل صفًا في الجدول]
        - ['(?, ?, ?)', 'معاملات (placeholders): ثلاث قيم لكل صف']
        theory: لا تبنِ SQL بدمج النصوص أبدًا. مع `?` تُرسل القيم **منفصلة** عن نص الأمر، فلا يمكن لقيمة خبيثة أن تغيّر معنى الاستعلام (**SQL injection**). وهي أسرع أيضًا لأن المحرك يحلّل الأمر مرة واحدة.
      7:
        what: '`commit` يثبّت التغييرات. قبله كانت داخل **معاملة (transaction)** مؤقتة يمكن التراجع عنها بـ`rollback()`.'
      8:
        what: 'استعلام: عمودان، للصفوف التي `pop > 1`، مرتبة تنازليًا. والقيمة 1 تُمرَّر معاملًا منفصلًا.'
        parts:
        - ['SELECT name, pop', ماذا نعيد]
        - [FROM cities, من أي جدول]
        - ['WHERE pop > ?', تصفية الصفوف]
        - [ORDER BY pop DESC, الترتيب التنازلي]
        theory: 'SQL لغة **تصريحية (declarative)**: تصف النتيجة المطلوبة ولا تكتب حلقة البحث؛ المحرك يختار طريقة التنفيذ (فهرس أم مسح كامل). والنتيجة **cursor**: مؤشر على صفوف لم تُقرأ بعد.'
      9:
        what: '`fetchall` تسحب كل صفوف النتيجة كقائمة tuples.'
      10:
        what: '`GROUP BY country` تقسم الصفوف حسب الدولة، و`SUM(pop)` تجمع السكان في كل مجموعة: الفكرة نفسها التي في `groupby` بـpandas.'
