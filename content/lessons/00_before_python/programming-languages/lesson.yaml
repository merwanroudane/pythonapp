quizzes:
  q-compiled:
    kind: concept
    question: "كيف يمكن وصف CPython (نسخة Python الأشهر) بدقة؟"
    options:
      - "لغة compiled مثل C تُنتج ملف machine code"
      - "تترجم الكود أولًا إلى bytecode، ثم يُنفّذه interpreter (آلة افتراضية)"
      - "تقرأ الكود حرفًا حرفًا دون أي ترجمة"
    answer: 1
    explanation: |
      وصف Python بأنها «interpreted فقط» تبسيط. CPython يمر بمرحلة **compilation إلى bytecode**
      ثم تنفّذ **Python Virtual Machine** هذا الـbytecode. المحاضرة القادمة تشرح ذلك خطوة بخطوة.
  q-typing:
    kind: predict
    question: "في Python، ماذا يحدث عند تنفيذ `\"1\" + 1`؟"
    options:
      - "`\"11\"` كما في JavaScript"
      - "`2`"
      - "`TypeError`"
    answer: 2
    explanation: |
      Python **strongly typed**: لا يحوّل الأنواع ضمنيًا بين نص ورقم. عليك أن تختار صراحة:
      `int("1") + 1` = 2، أو `"1" + str(1)` = `"11"`. أما JavaScript فـ**weakly typed** وتعطي `"11"`.
  q-declarative:
    kind: concept
    question: "أي لغة **تصريحية (declarative)**: تصف **ما** تريد لا **كيف** تحصل عليه؟"
    options: ["C", "SQL", "Assembly"]
    answer: 1
    explanation: |
      في SQL تكتب `SELECT name FROM students WHERE score > 15` فتصف النتيجة، ويقرر محرك قاعدة
      البيانات خطوات الوصول إليها.
  q-exit:
    kind: exit
    question: "أي وصف يطابق Python؟"
    options:
      - "static وweak typing، لغة منخفضة المستوى"
      - "dynamic وstrong typing، عالية المستوى، متعددة الأنماط، تُترجم إلى bytecode"
      - "لغة functional فقط"
    answer: 1
    explanation: |
      الأنواع تُفحص أثناء التنفيذ (dynamic) ولا تُحوَّل ضمنيًا بين الفئات المختلفة (strong)، وتدعم
      الأسلوب الإجرائي والكائني والوظيفي معًا.

# --- step-by-step command animations ---
animations:
  anim-typing:
    title: 'ديناميكية وقوية: نظام الأنواع في Python'
    code: |
      x = 5
      first_type = type(x).__name__
      x = "five"
      second_type = type(x).__name__
      converted = int("1") + 1
      joined = "1" + str(1)
      try:
          bad = "1" + 1
      except TypeError as err:
          message = str(err)
      print(first_type, second_type, converted, joined, message)
    notes:
      1:
        what: الاسم `x` يُربط بـobject من نوع `int`، دون أن نعلن النوع مسبقًا.
        theory: '**الكتابة الديناميكية (dynamic typing)**: النوع مرتبط **بالقيمة** لا بالمتغير، ويُفحص **أثناء التشغيل**. في اللغات **الساكنة (static)** مثل C وJava تكتب `int x = 5;` فيرفض الـcompiler إسناد نص إليه **قبل** التشغيل.'
      3:
        what: الاسم نفسه يشير الآن إلى `str`. الـobject القديم (5) لم يتغير؛ الذي تغيّر هو **الربط**.
      5:
        what: '**الكتابة القوية (strong typing)**: Python لا تخلط الأنواع ضمنيًا، فتحوّل بنفسك صراحة: `int("1")` ثم تجمع ← 2.'
      6:
        what: 'والعكس: الرقم إلى نص ثم **لصق** ← `''11''`. العامل `+` نفسه، والمعنى يختلف حسب الأنواع.'
      8:
        what: 'بلا تحويل: Python ترفض جمع نص ورقم وترفع `TypeError` أثناء التشغيل.'
        theory: 'محوران مستقلان: **ديناميكي/ساكن** يسأل *متى* تُفحص الأنواع، و**قوي/ضعيف** يسأل *هل* تُحوَّل ضمنيًا. JavaScript ديناميكية ضعيفة: `"1" + 1` تعطي `"11"` بصمت. وPython ديناميكية قوية: خطأ صريح أفضل من نتيجة خاطئة صامتة.'
      10:
        what: 'نلتقط رسالة الخطأ لنقرأها: تقول بالضبط أي نوعين لا يجتمعان.'
