id: paths-and-cwd
track: before_python
order: 6
title_ar: "الملفات والمسارات ومجلد العمل الحالي"
title_en: "Files, paths & the current working directory"
level: beginner
estimated_minutes: 25
prerequisites: [how-python-runs]
objectives:
  - "التمييز بين absolute path وrelative path."
  - "فهم current working directory ولماذا يحدد معنى المسار النسبي."
  - "تفكيك مسار إلى parent وname وstem وsuffix باستخدام pathlib."
  - "فهم لماذا يتعارض الرمز \\ في مسارات Windows مع escape sequences."
docs_url: "https://docs.python.org/3/library/pathlib.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [path, pathlib, cwd, windows, raw string, FileNotFoundError]

quizzes:
  q-relative:
    kind: concept
    question: |
      البرنامج يعمل من المجلد `C:\Users\sara\project`.
      إلى أين يشير المسار النسبي `data\raw.csv`؟
    options:
      - "`C:\\data\\raw.csv`"
      - "`C:\\Users\\sara\\project\\data\\raw.csv`"
      - "إلى المجلد الذي يوجد فيه ملف `.py` دائمًا، مهما كان مجلد العمل"
    answer: 1
    explanation: |
      المسار النسبي يُفسَّر انطلاقًا من **current working directory**، أي المجلد الذي
      شُغّل منه البرنامج، وليس بالضرورة المجلد الذي يوجد فيه ملف الكود.
  q-escape:
    kind: predict
    question: "ماذا سيطبع هذا السطر؟"
    code: |
      print("C:\new\table")
    options:
      - "`C:\\new\\table` كما هو مكتوب"
      - "`C:` ثم سطر جديد، ثم `ew`، ثم مسافة tab، ثم `able`"
      - "SyntaxError"
    answer: 1
    explanation: |
      داخل string عادية، `\n` تعني newline و`\t` تعني tab. لذلك «اختفت» الحروف `n` و`t`.
      الحل: `r"C:\new\table"` أو `"C:/new/table"` أو `pathlib`.
  q-exit:
    kind: exit
    question: "أي عبارة صحيحة؟"
    options:
      - "المسار المطلق يتغير معناه عندما يتغير مجلد العمل."
      - "المسار النسبي يتغير معناه عندما يتغير مجلد العمل."
      - "`suffix` للملف `report.final.pdf` هو `.final.pdf`."
    answer: 1
    explanation: |
      المسار المطلق يبدأ من الجذر فلا يعتمد على مجلد العمل. أما `suffix` فهو آخر امتداد
      فقط: `.pdf`، و`suffixes` تعطي `['.final', '.pdf']`.

exercises:
  ex-parts:
    title: "فكّك المسار"
    prompt: |
      لديك المسار أدناه. أنشئ ثلاثة متغيرات:

      - `folder` = اسم المجلد الذي يحتوي الملف مباشرة (نص).
      - `stem` = اسم الملف بدون امتداد.
      - `suffix` = الامتداد مع النقطة.

      استخدم خصائص `PureWindowsPath` ولا تكتب القيم يدويًا.
    starter: |
      from pathlib import PureWindowsPath

      p = PureWindowsPath(r"C:\Users\sara\project\data\raw.csv")

      folder = ...
      stem = ...
      suffix = ...
    solution: |
      from pathlib import PureWindowsPath

      p = PureWindowsPath(r"C:\Users\sara\project\data\raw.csv")

      folder = p.parent.name
      stem = p.stem
      suffix = p.suffix
    tests: |
      assert folder == "data", f"folder يجب أن يكون 'data' وليس {folder!r}"
      assert stem == "raw", f"stem يجب أن يكون 'raw' وليس {stem!r}"
      assert suffix == ".csv", f"suffix يجب أن يكون '.csv' وليس {suffix!r}"
    hints:
      - "المجلد الذي يحتوي الملف هو parent المسار، ونحتاج اسمه فقط."
      - "جرّب `p.parent` ثم `.name` عليه. وللملف: `p.stem` و`p.suffix`."
      - "`folder = p.parent.name`"

changes:
  ch-separators:
    title: "ثلاث طرق لكتابة المسار نفسه"
    base: |
      path = "C:\new_data\table.csv"
      print(path)
    base_label: "قبل · string عادية"
    variants:
      - label: "raw string"
        code: |
          path = r"C:\new_data\table.csv"
          print(path)
        explain: "البادئة `r` تجعل `\\` حرفًا عاديًا عند إنشاء الـliteral، فلا تتحول `\\n` و`\\t` إلى أحرف تحكم."
      - label: "forward slash"
        code: |
          path = "C:/new_data/table.csv"
          print(path)
        explain: "Windows يقبل `/` في معظم الـAPIs، ولا توجد escape sequences بالشرطة الأمامية."
      - label: "pathlib"
        code: |
          from pathlib import PureWindowsPath
          path = PureWindowsPath("C:/") / "new_data" / "table.csv"
          print(path)
        explain: "`pathlib` يبني المسار بالعامل `/` ويختار الفاصل الصحيح للنظام، وهو الطريقة الحديثة الموصى بها."

# --- step-by-step command animations ---
animations:
  anim-paths:
    title: من مسار نسبي إلى ملف حقيقي على القرص
    code: |
      from pathlib import Path

      cwd = Path.cwd()
      data_dir = Path("data")
      data_dir.mkdir(exist_ok=True)
      target = data_dir / "raw" / "survey.csv"
      full = target.resolve()
      parts = target.parts
      name, stem, suffix = target.name, target.stem, target.suffix
      exists = target.exists()
      target.parent.mkdir(parents=True, exist_ok=True)
      target.write_text("id,age\n1,34\n", encoding="utf-8")
      print(target.as_posix(), name, stem, suffix, exists, target.exists())
    notes:
      3:
        what: 'نسأل نظام التشغيل: ما **مجلد العمل الحالي (cwd)** لهذه العملية؟ منه تنطلق كل المسارات النسبية.'
        parts:
        - [Path.cwd(), current working directory]
        theory: 'كل process (برنامج قيد التشغيل) له cwd خاص به، **يرثه** من البرنامج الذي شغّله: الـterminal أو الـIDE. لذلك قد يعمل `open("data.csv")` من مجلد ويفشل من آخر: الكود نفسه، والـcwd مختلف.'
      4:
        what: 'مسار **نسبي**: لا يبدأ بحرف قرص ولا بـ`/`، فمعناه «المجلد `data` داخل الـcwd». وإنشاء Path لا يلمس القرص.'
      5:
        what: 'الآن نلمس القرص فعلًا: ننشئ المجلد. و`exist_ok=True` تعني «لا تعترض إن كان موجودًا».'
      6:
        what: العامل `/` بين Path ونص **يبني مسارًا** بالفاصل الصحيح لنظام التشغيل.
        parts:
        - [data_dir / "raw", ضمّ مجلد إلى المسار]
        - [/ "survey.csv", ثم اسم الملف]
        theory: 'لهذا نستخدم pathlib بدل تركيب النصوص يدويًا: الفاصل `\` يعمل في Windows فقط، و`/` في Path يعمل في كل الأنظمة. والمسار هنا ما زال **وصفًا**: الملف غير موجود بعد.'
      7:
        what: '`resolve()` تحوّل المسار النسبي إلى **مطلق**: الـcwd + المسار النسبي، مع حذف `..` و`.`.'
        theory: المسار **المطلق** يبدأ من جذر نظام الملفات فيعني الشيء نفسه من أي cwd. والمسار **النسبي** أقصر ويجعل المشروع قابلًا للنقل بين الأجهزة، لكنه يعتمد على الـcwd.
      8:
        what: '`parts` تفكك المسار إلى أجزائه: `(''data'', ''raw'', ''survey.csv'')`.'
      9:
        what: أجزاء اسم الملف.
        parts:
        - [name, '`''survey.csv''`: الاسم كاملًا']
        - [stem, '`''survey''`: بلا امتداد']
        - [suffix, '`''.csv''`: الامتداد، وهو عُرف لا يضمن محتوى الملف']
      10:
        what: 'نسأل القرص: هل الملف موجود؟ الجواب `False` لأننا لم ننشئه بعد.'
      11:
        what: '`parent` المجلد الحاوي (`data/raw`)، و`parents=True` تنشئ كل المجلدات الناقصة في الطريق.'
      12:
        what: 'نكتب الملف فعليًا. في المخرجات: `exists` بقي `False` لأنه أُخذ قبل الإنشاء، أما `target.exists()` الآن فتعطي `True`.'
