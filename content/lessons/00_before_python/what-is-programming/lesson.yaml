quizzes:
  q-literal:
    kind: concept
    question: "طلبت من الحاسوب «احسب متوسط الدرجات» ولم تحدد ماذا يفعل إن كانت القائمة فارغة. ماذا سيحدث؟"
    options:
      - "سيفهم أنك تقصد إعادة صفر"
      - "سينفّذ التعليمات حرفيًا، فيقسم على صفر ويظهر خطأ"
      - "سيتجاهل الحساب"
    answer: 1
    explanation: |
      الحاسوب لا يخمّن النوايا. كل حالة لم تحددها (قائمة فارغة، قيمة مفقودة، نص بدل رقم) هي
      حالة سيتصرف فيها بطريقة قد لا تريدها. جزء كبير من البرمجة هو التفكير في هذه الحالات مسبقًا.
  q-property:
    kind: concept
    question: "أي مما يلي **ليس** من خصائص الخوارزمية؟"
    options:
      - "أن تنتهي بعد عدد محدود من الخطوات"
      - "أن تكون كل خطوة محددة بلا لبس"
      - "أن تُكتب بلغة برمجة معيّنة"
      - "أن تُنتج مخرجًا"
    answer: 2
    explanation: |
      الخوارزمية فكرة مستقلة عن أي لغة: يمكن كتابتها بالعربية، بـpseudocode، بمخطط، أو بـPython
      أو C. اللغة مجرد وسيلة للتعبير عنها للحاسوب.
  q-exit:
    kind: exit
    question: "ما الترتيب الأنسب للعمل على مشكلة جديدة؟"
    options:
      - "كتابة الكود مباشرة ثم التفكير في الحالات الخاصة"
      - "فهم المشكلة ← تفكيكها ← تصميم الخوارزمية (pseudocode) ← الكود ← الاختبار"
      - "البحث عن مكتبة جاهزة دائمًا"
    answer: 1
    explanation: |
      الكود هو الخطوة الأخيرة في التفكير، لا الأولى. خوارزمية واضحة على الورق تجعل الكود قصيرًا
      وتكشف الحالات الخاصة قبل أن تصبح أخطاء.
