quizzes:
  q-literal:
    kind: concept
    question: "طلبت من الحاسوب «احسب متوسط الدرجات» ولم تحدد ماذا يفعل إن كانت القائمة فارغة. ماذا سيحدث؟"
    options:
      - "سيفهم أنك تقصد إعادة صفر"
      - "سينفّذ التعليمات حرفيًا، فيقسم على صفر ويظهر خطأ"
      - "سيتجاهل الحساب"
    answer: 1
    explanation: |
      الحاسوب لا يخمّن النوايا. كل حالة لم تحددها (قائمة فارغة، قيمة مفقودة، نص بدل رقم) هي
      حالة سيتصرف فيها بطريقة قد لا تريدها. جزء كبير من البرمجة هو التفكير في هذه الحالات مسبقًا.
  q-property:
    kind: concept
    question: "أي مما يلي **ليس** من خصائص الخوارزمية؟"
    options:
      - "أن تنتهي بعد عدد محدود من الخطوات"
      - "أن تكون كل خطوة محددة بلا لبس"
      - "أن تُكتب بلغة برمجة معيّنة"
      - "أن تُنتج مخرجًا"
    answer: 2
    explanation: |
      الخوارزمية فكرة مستقلة عن أي لغة: يمكن كتابتها بالعربية، بـpseudocode، بمخطط، أو بـPython
      أو C. اللغة مجرد وسيلة للتعبير عنها للحاسوب.
  q-exit:
    kind: exit
    question: "ما الترتيب الأنسب للعمل على مشكلة جديدة؟"
    options:
      - "كتابة الكود مباشرة ثم التفكير في الحالات الخاصة"
      - "فهم المشكلة ← تفكيكها ← تصميم الخوارزمية (pseudocode) ← الكود ← الاختبار"
      - "البحث عن مكتبة جاهزة دائمًا"
    answer: 1
    explanation: |
      الكود هو الخطوة الأخيرة في التفكير، لا الأولى. خوارزمية واضحة على الورق تجعل الكود قصيرًا
      وتكشف الحالات الخاصة قبل أن تصبح أخطاء.

# --- step-by-step command animations ---
animations:
  anim-algorithm:
    title: 'خوارزمية المتوسط: Input ← Process ← Output'
    code: |
      scores = [12, 15, 18]

      if len(scores) == 0:
          print("no scores")
      else:
          total = 0
          for score in scores:
              total = total + score
          mean = total / len(scores)
          print("mean =", mean)
    notes:
      1:
        what: '**Input**: البيانات التي تعمل عليها الخوارزمية، وهي هنا ثلاث درجات.'
        theory: 'كل برنامج يمكن وصفه بنموذج **Input → Process → Output**. تتبّع الأقسام الثلاثة وأنت تتقدم: السطر 1 مُدخل، والأسطر 3 إلى 9 معالجة، والسطر 10 مُخرج.'
      3:
        what: '**حالة حدّية**: قبل القسمة نتأكد أن القائمة ليست فارغة، وإلا قسمنا على صفر. الخوارزمية الجيدة تفكر في كل المدخلات الممكنة.'
        theory: 'من خصائص الخوارزمية أن تكون **محددة (definite)**: كل خطوة لها معنى واحد، ولكل حالة مسار واضح، بما فيها الحالات الغريبة كالقائمة الفارغة أو القيمة المفقودة.'
      6:
        what: '**التهيئة (initialization)**: مُجمِّع يبدأ من الصفر، كما تفعل بالورقة والقلم.'
      7:
        what: '**التكرار**: الخطوة نفسها لكل عنصر. راقب لوحة الحلقة: أي عنصر نعالج الآن؟'
        theory: 'يجب أن **تنتهي** الخوارزمية (finiteness): هذه الحلقة تمر على عدد محدود من العناصر ثم تتوقف. أما حلقة لا تنتهي فليست خوارزمية بل خطأ.'
      8:
        what: '**التراكم**: الطرف الأيمن يُحسب أولًا بالقيمة القديمة، ثم يُربط `total` بالنتيجة الجديدة: 12، ثم 27، ثم 45.'
      9:
        what: 'آخر معالجة: المجموع ÷ العدد = 15.0.'
      10:
        what: '**Output**: النتيجة تخرج إلى الشاشة. والخوارزمية نفسها يمكن كتابتها بأي لغة؛ Python ليست إلا طريقة للتعبير عنها.'
