quizzes:
  q-naming:
    kind: concept
    question: "أي تسمية تتبع PEP 8؟"
    options:
      - "`def CleanData(RawTable):` و`class data_set:`"
      - "`def clean_data(raw_table):` و`class DataSet:` و`MAX_ROWS = 100`"
      - "`def cleandata(x):` و`class dataset:`"
    answer: 1
    explanation: |
      الدوال والمتغيرات `snake_case`، والـclasses `CapWords`، والثوابت `UPPER_CASE`. التسمية الواضحة أهم
      قاعدة جودة على الإطلاق.
  q-test:
    kind: concept
    question: "ما الذي يجعل اختبارًا جيدًا؟"
    options:
      - "أن يطبع النتيجة لتنظر إليها"
      - "أن يتحقق آليًا من نتيجة متوقعة محددة، بما في ذلك الحالات الحدّية"
      - "أن يكون طويلًا"
    answer: 1
    explanation: |
      الاختبار الآلي يفشل من تلقاء نفسه عندما يتغير السلوك، دون أن تحتاج قراءة المخرجات. غطِّ الحالة
      العادية والحالات الحدّية (قائمة فارغة، صفر، قيمة مفقودة).
  q-exit:
    kind: exit
    question: "لماذا logging أفضل من print في برنامج حقيقي؟"
    options:
      - "لأنه أسرع فقط"
      - "لأن له مستويات (DEBUG/INFO/WARNING/ERROR) ووقتًا ومصدرًا، ويمكن توجيهه لملف أو إيقافه دون حذف الأسطر"
      - "لأن print لا تعمل في الـscripts"
    answer: 1
    explanation: "تضبط مستوى التفاصيل من مكان واحد، وتحتفظ بسجل يمكن مراجعته بعد التشغيل."

exercises:
  ex-tests:
    title: "اكتب اختبارات لدالة"
    prompt: |
      الدالة `normalize(values)` تحوّل القيم إلى المجال [0, 1] بالصيغة `(x - min) / (max - min)`.
      اكتب **ثلاث دوال اختبار** تبدأ أسماؤها بـ`test_`:

      - `test_basic`: `normalize([0, 5, 10])` تساوي `[0.0, 0.5, 1.0]`.
      - `test_negative`: تعمل مع القيم السالبة، مثل `[-2, 0, 2]`.
      - `test_constant`: عندما تتساوى كل القيم تُعيد أصفارًا، مثل `[3, 3]` ← `[0.0, 0.0]`.

      ثم أصلح الدالة حتى تنجح الاختبارات الثلاثة (الحالة الأخيرة تقسم على صفر حاليًا).
    starter: |
      def normalize(values):
          lo, hi = min(values), max(values)
          return [(x - lo) / (hi - lo) for x in values]

      # write test_basic, test_negative, test_constant here
    solution: |
      def normalize(values):
          lo, hi = min(values), max(values)
          if hi == lo:
              return [0.0 for _ in values]
          return [(x - lo) / (hi - lo) for x in values]

      def test_basic():
          assert normalize([0, 5, 10]) == [0.0, 0.5, 1.0]

      def test_negative():
          assert normalize([-2, 0, 2]) == [0.0, 0.5, 1.0]

      def test_constant():
          assert normalize([3, 3]) == [0.0, 0.0]

      for test in (test_basic, test_negative, test_constant):
          test()
      print("all tests passed")
    tests: |
      _tests = [v for k, v in dict(globals()).items() if k.startswith("test_") and callable(v)]
      assert len(_tests) >= 3, f"اكتب ثلاث دوال test_ على الأقل (وجدت {len(_tests)})"
      for _t in _tests:
          _t()
      assert normalize([3, 3, 3]) == [0.0, 0.0, 0.0], "حالة القيم المتساوية ما زالت تفشل"
      assert normalize([1, 3]) == [0.0, 1.0]
    hints:
      - "كل اختبار دالة بلا parameters تحتوي `assert normalize(...) == [...]`."
      - "الحالة `[3, 3]` تجعل `hi - lo` صفرًا. افحصها قبل القسمة وأعِد قائمة أصفار."
      - "`if hi == lo: return [0.0 for _ in values]`"

# --- step-by-step command animations ---
animations:
  anim-tests:
    title: ماذا يفعل pytest فعلًا؟ مشغّل اختبارات مصغّر
    code: |
      def celsius_to_f(c):
          return c * 9 / 5 + 32


      def test_freezing():
          assert celsius_to_f(0) == 32


      def test_body_temperature():
          assert celsius_to_f(37) == 98


      results = {}
      for test in [test_freezing, test_body_temperature]:
          try:
              test()
              results[test.__name__] = "passed"
          except AssertionError:
              results[test.__name__] = "FAILED"
      print(results)
    notes:
      1:
        what: '`def` يُنشئ الدالة التي نريد اختبارها ويربطها بالاسم. جسمها **لا يُنفَّذ** الآن.'
      5:
        what: 'دالة اختبار: اسمها يبدأ بـ`test_`، بلا معاملات، وفيها `assert`.'
        theory: 'هذا عقد pytest: يبحث في الملفات `test_*.py` عن الدوال `test_*` ويستدعيها واحدة واحدة. الاختبار **ينجح** إن انتهى بلا exception، و**يفشل** إن رفع خطأ.'
      6:
        what: '`assert` يقيّم الشرط: إن كان `True` لا يحدث شيء، وإن كان `False` يرفع `AssertionError`.'
        parts:
        - [assert, «يجب أن يكون هذا صحيحًا»]
        - [celsius_to_f(0), النتيجة **الفعلية**]
        - [== 32, النتيجة **المتوقعة**، محسوبة بطريقة مستقلة (الماء يتجمد عند 32°F)]
        theory: 'الاختبار الجيد يقارن نتيجة فعلية بنتيجة متوقعة **معروفة مسبقًا**: حالات حدية، أمثلة من المراجع، خصائص يجب أن تصح دائمًا. اختبار يحسب المتوقع بالكود نفسه لا يختبر شيئًا.'
      10:
        what: '37°C تساوي 98.6°F لا 98، فالشرط `False` ويُرفع `AssertionError`: ستقفز Python إلى `except`.'
      14:
        what: 'نفعل يدويًا ما يفعله pytest: نمر على دوال الاختبار. الدوال objects، فيمكن وضعها في قائمة.'
      16:
        what: 'نستدعي دالة الاختبار الحالية. راقب الـcall stack: دالة الاختبار ستستدعي `celsius_to_f`.'
      17:
        what: وصلنا إلى هنا فقط لأن الاختبار **لم يرفع خطأ**. و`__name__` اسم الدالة كنص.
      18:
        what: التقطنا الفشل وسجّلناه بدل أن يتوقف البرنامج، كما يفعل pytest ليكمل بقية الاختبارات.
        theory: 'لاحظ أن الخطأ هنا **في الاختبار** لا في الدالة: القيمة المتوقعة خاطئة. الاختبار الفاشل يعني «هناك تناقض بين الكود وتوقعك»، والتحقيق يحدد أيهما على خطأ.'
