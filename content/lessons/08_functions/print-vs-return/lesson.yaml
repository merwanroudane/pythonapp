id: print-vs-return
track: functions
order: 1
title_ar: "الفرق بين print وreturn"
title_en: "print vs return"
level: beginner
estimated_minutes: 35
prerequisites: [first-line-print, for-loop]
objectives:
  - "التمييز بين stdout (ما يُعرض للإنسان) والقيمة المُعادة (ما يستلمه الكود)."
  - "فهم الـimplicit None عندما لا تحتوي الدالة return."
  - "معرفة أن return تُنهي الدالة فورًا."
  - "فصل الحساب (computation) عن العرض (presentation)."
docs_url: "https://docs.python.org/3/reference/simple_stmts.html#the-return-statement"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [function, return, print, None, stdout, call frame]

quizzes:
  q-result:
    kind: predict
    question: "ما قيمة `result` بعد التنفيذ؟"
    code: |
      def double(x):
          print(x * 2)

      result = double(5)
    options: ["`10`", "`None`", "`\"10\"`"]
    answer: 1
    explanation: |
      الدالة **طبعت** 10 على stdout، لكنها لم **تُعِد** شيئًا. كل دالة تنتهي بلا `return`
      تُعيد `None` ضمنيًا، وهذا ما خُزّن في `result`.
  q-after-return:
    kind: predict
    question: "ماذا يطبع هذا الكود؟"
    code: |
      def f():
          return 1
          print("after return")

      print(f())
    options: ["`after return` ثم `1`", "`1` فقط", "`1` ثم `after return`"]
    answer: 1
    explanation: |
      `return` تُنهي الدالة فورًا وتعيد القيمة للـcaller. السطر بعدها **unreachable**
      ولا يُنفَّذ أبدًا.
  q-exit:
    kind: exit
    question: "دالة تحسب متوسطًا ستُستخدم نتيجته في حسابات لاحقة. ماذا يجب أن تفعل؟"
    options:
      - "`print` المتوسط"
      - "`return` المتوسط، ويطبعه من يحتاج العرض"
      - "الاثنان دائمًا"
    answer: 1
    explanation: |
      الحساب يُعيد قيمة؛ العرض قرار منفصل يتخذه الـcaller. هكذا تصبح الدالة قابلة لإعادة
      الاستخدام في تقرير أو اختبار أو pipeline.

exercises:
  ex-mean:
    title: "أصلح الدالة لتُعيد القيمة"
    prompt: |
      الدالة `mean` تطبع المتوسط بدل أن تُعيده، لذلك `m * 2` يرفع `TypeError`.
      عدّل الدالة لتُعيد المتوسط بـ`return`، واترك الطباعة للـcaller.
    starter: |
      def mean(values):
          total = 0
          for v in values:
              total += v
          print(total / len(values))

      m = mean([2, 4, 9])
      print("twice the mean:", m * 2)
    solution: |
      def mean(values):
          total = 0
          for v in values:
              total += v
          return total / len(values)

      m = mean([2, 4, 9])
      print("twice the mean:", m * 2)
    tests: |
      import math as _m
      import io as _io, contextlib as _cl
      _buf = _io.StringIO()
      with _cl.redirect_stdout(_buf):
          _r = mean([1, 2, 3, 4])
      assert _r is not None, "mean ما زالت تُعيد None؛ هل استبدلت print بـreturn؟"
      assert _m.isclose(_r, 2.5), f"mean([1, 2, 3, 4]) يجب أن تُعيد 2.5 وليس {_r!r}"
      assert _buf.getvalue() == "", "الدالة يجب ألا تطبع شيئًا؛ الطباعة مسؤولية الـcaller"
    hints:
      - "الخطأ `TypeError: unsupported operand ... 'NoneType'` يعني أن `m` هي `None`."
      - "استبدل `print(...)` في آخر الدالة بالكلمة المناسبة التي ترسل القيمة للـcaller."
      - "`return total / len(values)`"

changes:
  ch-print-return:
    title: "نفس الدالة، سطر واحد مختلف"
    base: |
      def double(x):
          print(x * 2)

      result = double(5)
      print("stored:", result)
    base_label: "قبل · print داخل الدالة"
    variants:
      - label: "return"
        code: |
          def double(x):
              return x * 2

          result = double(5)
          print("stored:", result)
        explain: "مع `return` تصل القيمة 10 إلى الـcaller وتُخزَّن في `result`. لم يطبع شيء داخل الدالة؛ الطباعة الوحيدة من الـcaller."
      - label: "الاثنان معًا"
        code: |
          def double(x):
              print("debug:", x * 2)
              return x * 2

          result = double(5)
          print("stored:", result)
        explain: "يمكن أن تطبع الدالة (مثلًا للتشخيص) **وأيضًا** تُعيد قيمة. لكن في الكود النهائي يُفضّل logging بدل print داخل دوال الحساب."

# --- step-by-step command animations ---
animations:
  anim-print:
    title: دالة تطبع ولا تُعيد
    code: |
      def double(x):
          print(x * 2)

      result = double(5)
      print("result is", result)
    notes:
      1: '`def` يُنشئ الدالة ويربطها بالاسم `double`؛ جسمها لا يُنفَّذ الآن.'
      2:
        what: 'داخل الدالة: `print` **تعرض** `10` على الشاشة... لكنها لا تُسلّم شيئًا للمستدعي.'
        theory: 'الشاشة ليست متغيرًا: ما يُطبع يذهب إلى stdout ولا يستطيع البرنامج استعماله بعد ذلك. والدالة هنا تنتهي بلا `return`، فتعيد `None` ضمنيًا.'
      4: 'نستدعي الدالة ونستقبل ما **تعيده** في `result`. راقب الـcall stack: frame جديد لـ`double` فيه `x=5`.'
      5: '`result` هو `None`! الـ10 ظهرت على الشاشة لكنها لم تصل إلى `result`.'
  anim-return:
    title: دالة تُعيد قيمة
    code: |
      def double(x):
          return x * 2

      result = double(5)
      print("result is", result)
    notes:
      1: '`def` يُنشئ الدالة ويربطها بالاسم `double`؛ جسمها لا يُنفَّذ الآن.'
      2:
        what: '`return` **تُنهي** الدالة فورًا و**تُسلّم** القيمة `10` للمستدعي، ولا شيء يُطبع هنا.'
        parts:
        - [return, أنهِ الدالة وأعد القيمة]
        - [x * 2, القيمة المُعادة، تُحسب أولًا]
        theory: 'القيمة المُعادة تحلّ محل **استدعاء الدالة** في التعبير: `double(5)` يصبح حرفيًا `10`، فيمكن إسناده أو جمعه أو تمريره لدالة أخرى. وهذا ما يجعل الدوال قابلة للتركيب: `double(double(5))`.'
      4: نستدعي الدالة، فتُربط قيمتها المُعادة بـ`result`.
      5: '`result` = 10: القيمة وصلت فعلًا ويمكن استعمالها. القاعدة: الدالة **تحسب وتعيد**، والطباعة مكانها في النهاية عند المستدعي.'
