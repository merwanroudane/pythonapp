id: stdlib-tour
track: stdlib
order: 1
title_ar: "جولة في المكتبة القياسية: الأداة المناسبة لكل مهمة"
title_en: "A tour of the standard library: the right module for each task"
level: beginner_to_intermediate
estimated_minutes: 45
prerequisites: [modules-imports]
objectives:
  - "معرفة خريطة المكتبة القياسية حسب المهمة لا حسب الترتيب الأبجدي."
  - "استخدام math وstatistics وrandom (مع seed) للحسابات."
  - "التعامل مع التواريخ بـdatetime: الإنشاء، الفرق، التنسيق، والتحويل من نص."
  - "استخدام itertools وfunctools لمهام شائعة، وtime/timeit للقياس."
docs_url: "https://docs.python.org/3/library/index.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [standard library, math, statistics, random, seed, datetime, itertools, functools, timeit]

quizzes:
  q-seed:
    kind: predict
    question: "هل يطبع السطران القيمة نفسها؟"
    code: |
      import random
      random.seed(42); a = random.random()
      random.seed(42); b = random.random()
      print(a == b)
    options: ["`True`", "`False`", "يتغير في كل تشغيل"]
    answer: 0
    explanation: |
      الأرقام «العشوائية» في الحاسوب **شبه عشوائية (pseudo-random)**: تُولَّد بخوارزمية من بذرة (seed).
      البذرة نفسها تعطي السلسلة نفسها، وهذا أساس قابلية إعادة إنتاج المحاكاة.
  q-dates:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      from datetime import date
      print((date(2026, 3, 1) - date(2026, 2, 1)).days)
    options: ["`30`", "`28`", "`31`"]
    answer: 1
    explanation: "فبراير 2026 فيه 28 يومًا. `datetime` يعرف التقويم، فلا تحسب الفروق يدويًا."
  q-exit:
    kind: exit
    question: "أي module تستخدم للأرقام العشوائية في تطبيق أمني (كلمات مرور، tokens)؟"
    options: ["`random`", "`secrets`", "`math`"]
    answer: 1
    explanation: |
      `random` مصمم للمحاكاة والإحصاء وتسلسله قابل للتوقع. للأمان استخدم `secrets`.

exercises:
  ex-toolbox:
    title: "صندوق أدوات صغير"
    prompt: |
      باستخدام المكتبة القياسية فقط:

      - `sd`: الانحراف المعياري للعينة `sample` (بـ`statistics`)، مقرّبًا لمنزلتين.
      - `days_left`: عدد الأيام من `2026-09-24` حتى `2026-12-31` (بـ`datetime.date`).
      - `parsed`: تحويل النص `"15/03/2024"` إلى `date` بـ`datetime.strptime`.
      - `pairs`: كل الأزواج الممكنة (بلا تكرار الترتيب) من `["a", "b", "c"]` بـ`itertools.combinations`، كقائمة.
    starter: |
      sample = [12, 15, 11, 18, 14]

      sd = ...
      days_left = ...
      parsed = ...
      pairs = ...

      print(sd, days_left, parsed, pairs)
    solution: |
      import itertools
      import statistics
      from datetime import date, datetime

      sample = [12, 15, 11, 18, 14]

      sd = round(statistics.stdev(sample), 2)
      days_left = (date(2026, 12, 31) - date(2026, 9, 24)).days
      parsed = datetime.strptime("15/03/2024", "%d/%m/%Y").date()
      pairs = list(itertools.combinations(["a", "b", "c"], 2))

      print(sd, days_left, parsed, pairs)
    tests: |
      import datetime as _dt
      assert sd == 2.74, f"sd يجب أن يكون 2.74 وليس {sd}"
      assert days_left == 98, f"days_left يجب أن يكون 98 وليس {days_left}"
      assert parsed == _dt.date(2024, 3, 15), f"parsed غير صحيح: {parsed!r}"
      assert pairs == [("a", "b"), ("a", "c"), ("b", "c")], f"pairs غير صحيح: {pairs}"
    hints:
      - "`statistics.stdev` لانحراف العينة. وطرح تاريخين يعطي `timedelta` لها الخاصية `.days`."
      - "`datetime.strptime(text, \"%d/%m/%Y\")` ثم `.date()`. و`itertools.combinations(xs, 2)` ثم `list(...)`."
      - "`days_left = (date(2026, 12, 31) - date(2026, 9, 24)).days`"

# --- step-by-step command animations ---
animations:
  anim-stdlib:
    title: 'ثلاث أدوات جاهزة: Counter وdate وstatistics'
    code: |
      from collections import Counter
      from datetime import date, timedelta
      import statistics

      words = "the cat and the hat and the bat".split()
      counts = Counter(words)
      top = counts.most_common(2)
      start = date(2024, 3, 1)
      deadline = start + timedelta(days=30)
      gap = (deadline - start).days
      scores = [12, 15, 9, 14]
      mean = statistics.mean(scores)
      spread = round(statistics.stdev(scores), 2)
      print(top, deadline.isoformat(), gap, mean, spread)
    notes:
      1:
        what: 'نستورد من المكتبة القياسية: لا تثبيت، فهي تأتي مع Python نفسها.'
        parts:
        - [collections, 'بنى بيانات إضافية: `Counter`، `defaultdict`، `deque`، `namedtuple`']
        - [datetime, التواريخ والأوقات والمدد]
        - [statistics, إحصاءات وصفية بسيطة]
      5:
        what: '`split()` بلا معامل تقسم النص على المسافات، فنحصل على قائمة كلمات.'
      6:
        what: '`Counter` يعدّ تكرار كل عنصر في مرور واحد، ويعيد قاموسًا خاصًا: المفتاح هو العنصر والقيمة عدد مراته.'
        parts:
        - [Counter, subclass من `dict` متخصص في العدّ]
        - [(words), 'أي iterable: قائمة، نص (فيعدّ الحروف)، generator']
        theory: 'بدون `Counter` تكتب حلقة: `d[w] = d.get(w, 0) + 1`. المكتبة القياسية تجمع هذه الأنماط المتكررة في أدوات **مختبرة وسريعة** (بعضها مكتوب بلغة C). هذا معنى «batteries included»: قبل أن تكتب أداة، اسأل هل هي موجودة.'
      7:
        what: '`most_common(2)` أكثر عنصرين تكرارًا، كقائمة tuples `(العنصر، العدد)` مرتبة تنازليًا.'
      8:
        what: '`date(2024, 3, 1)` تاريخ بلا وقت. الترتيب دائمًا: سنة، شهر، يوم.'
        parts:
        - [date, تاريخ فقط]
        - [datetime, تاريخ + وقت]
        - [timedelta, 'مدة زمنية: الفرق بين لحظتين']
      9:
        what: تاريخ + مدة = تاريخ جديد. Python تتكفل بطول كل شهر وبالسنوات الكبيسة.
        theory: 'الأنواع هنا تتبع «جبرًا» واضحًا: `date + timedelta → date`، و`date - date → timedelta`، أما `date + date` فخطأ `TypeError` لأنه بلا معنى. تصميم الأنواع الجيد **يمنع الأخطاء المنطقية** قبل وقوعها.'
      10:
        what: طرح تاريخين يعطي `timedelta`، والخاصية `.days` عدد الأيام فيه.
      12:
        what: '`statistics.mean` المتوسط الحسابي: (12 + 15 + 9 + 14) / 4 = 12.5.'
      13:
        what: '`stdev` الانحراف المعياري **للعينة** (يقسم على n − 1)، أما `pstdev` فللمجتمع (يقسم على n).'
        theory: مجموع مربعات الانحرافات عن 12.5 هو 21، مقسومًا على 3 = 7، وجذره ≈ 2.65. القسمة على n − 1 (**تصحيح Bessel**) تجعل تقدير التباين غير متحيز عندما نقدّر تباين مجتمع من عينة.
