id: operators-precedence
track: operators
order: 1
title_ar: "العوامل والأولوية: كيف يحسب Python التعبير"
title_en: "Operators & precedence: how Python evaluates an expression"
level: beginner
estimated_minutes: 30
prerequisites: [numbers-and-floats]
objectives:
  - "استخدام عوامل الحساب والمقارنة والمنطق والعضوية والهوية."
  - "توقّع ترتيب التنفيذ حسب الأولوية (precedence) واستخدام الأقواس للوضوح."
  - "فهم المقارنات المتسلسلة مثل 18 <= age < 65."
  - "تجنّب فخ -2 ** 2 وفخ خلط and/or بلا أقواس."
docs_url: "https://docs.python.org/3/reference/expressions.html#operator-precedence"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [operators, precedence, comparison, chained, and, or, in, is, power]

quizzes:
  q-power:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      print(-2 ** 2, (-2) ** 2)
    options: ["`4 4`", "`-4 4`", "`-4 -4`"]
    answer: 1
    explanation: |
      `**` أعلى أولوية من الإشارة السالبة الأحادية، فيُحسب `-(2 ** 2)` = `-4`.
      بالأقواس `(-2) ** 2` = `4`.
  q-mix:
    kind: predict
    question: "ما قيمة التعبير؟"
    code: |
      print(2 + 3 * 4 ** 2 // 5)
    options: ["`16`", "`11`", "`18`"]
    answer: 1
    explanation: |
      الترتيب: `4 ** 2` = 16، ثم `3 * 16` = 48، ثم `48 // 5` = 9 (نفس مستوى `*` من اليسار
      لليمين)، ثم `2 + 9` = 11.
  q-exit:
    kind: exit
    question: "`x = 5`. ما قيمة `1 < x < 10`؟"
    options: ["`True`", "`False`", "`TypeError`"]
    answer: 0
    explanation: "المقارنة المتسلسلة تعني `1 < x and x < 10`، ويُحسب `x` مرة واحدة فقط."

exercises:
  ex-eligible:
    title: "شروط الأهلية في تعبير واحد"
    prompt: |
      أنشئ ثلاثة متغيرات منطقية (bool) من البيانات المعطاة:

      - `adult`: العمر من 18 إلى أقل من 65 (استخدم مقارنة متسلسلة).
      - `valid_email`: يحتوي الإيميل على `"@"` **و** لا ينتهي بنقطة.
      - `eligible`: `adult` صحيح **و** (`valid_email` صحيح **أو** `has_phone` صحيح).
    starter: |
      age = 34
      email = "sara@example.org"
      has_phone = False

      adult = ...
      valid_email = ...
      eligible = ...

      print(adult, valid_email, eligible)
    solution: |
      age = 34
      email = "sara@example.org"
      has_phone = False

      adult = 18 <= age < 65
      valid_email = "@" in email and not email.endswith(".")
      eligible = adult and (valid_email or has_phone)

      print(adult, valid_email, eligible)
    tests: |
      assert adult is True, "adult: 18 <= age < 65"
      assert valid_email is True, "valid_email: '@' in email and not email.endswith('.')"
      assert eligible is True, "eligible: adult and (valid_email or has_phone)"
      for _age, _mail, _ph, _want in [(17, "a@b.c", True, False), (40, "bad.", False, False), (40, "bad.", True, True)]:
          _adult = 18 <= _age < 65
          _valid = "@" in _mail and not _mail.endswith(".")
          assert (_adult and (_valid or _ph)) == _want
    hints:
      - "`in` تفحص وجود نص داخل نص، و`not` تعكس القيمة المنطقية."
      - "`18 <= age < 65`. وانتبه: `and` أعلى أولوية من `or`، فاستخدم أقواسًا حول `or`."
      - "`eligible = adult and (valid_email or has_phone)`"

changes:
  ch-parens:
    title: "and / or بلا أقواس"
    base: |
      is_admin = False
      is_owner = False
      is_active = True
      print(is_admin or is_owner and is_active)
    base_label: "قبل · بلا أقواس"
    variants:
      - label: "is_admin = True"
        code: |
          is_admin = True
          is_owner = False
          is_active = False
          print(is_admin or is_owner and is_active)
        explain: "`and` تُحسب أولًا: `is_admin or (is_owner and is_active)`. لذلك مدير غير نشط يمر!"
      - label: "بأقواس صريحة"
        code: |
          is_admin = True
          is_owner = False
          is_active = False
          print((is_admin or is_owner) and is_active)
        explain: "الأقواس تفرض المعنى المقصود: «مدير أو مالك، **وفي الحالتين** نشط». عند الشك، ضع أقواسًا."

# --- step-by-step command animations ---
animations:
  anim-ops:
    title: 'كيف تقرأ Python التعبير: الأولوية والتجميع والمنطق'
    code: |
      a = 2 + 3 * 4
      b = (2 + 3) * 4
      c = -2 ** 2
      d = 2 ** 3 ** 2
      e = 10 - 4 - 3
      rain, weekend, ticket = True, False, True
      go = weekend and not rain or ticket
      go2 = weekend and (not rain or ticket)
      age = 20
      between = 0 < age < 30
      same = [1] == [1]
      identical = [1] is [1]
      print(a, b, c, d, e, go, go2, between, same, identical)
    notes:
      1:
        what: '`*` أعلى أولوية من `+`، فيُحسب `3 * 4` أولًا: 2 + 12 = 14.'
        theory: 'الـparser يبني من التعبير **شجرة**: العامل الأعلى أولوية ينزل أعمق في الشجرة فيُحسب أولًا. `2 + 3 * 4` تصبح `+(2, *(3, 4))`، وجدول الأولويات ليس إلا قواعد بناء هذه الشجرة.'
      2:
        what: 'الأقواس تغيّر الشجرة: الجمع أولًا ← 20. وعند الشك استعمل الأقواس، فالوضوح أهم من الاختصار.'
      3:
        what: 'مفاجأة: `-4` لا `4`! الأس `**` أعلى أولوية من الإشارة السالبة، فالتعبير هو `-(2 ** 2)`.'
      4:
        what: '`**` **يُجمَّع من اليمين (right-associative)**: `2 ** (3 ** 2)` = 2⁹ = 512، لا (2³)² = 64.'
        theory: 'معظم العوامل تُجمَّع من اليسار: `10 - 4 - 3` = `(10 - 4) - 3`. أما الأس فمن اليمين، اتباعًا للرياضيات حيث a^b^c تعني a^(b^c).'
      5:
        what: 'من اليسار: (10 − 4) − 3 = 3.'
      7:
        what: '`and` أعلى أولوية من `or`، فالتعبير يُقرأ `(weekend and not rain) or ticket` ← `True` لأن التذكرة موجودة.'
        theory: 'الترتيب: المقارنات أولًا، ثم `not`، ثم `and`، ثم `or`. وهذا يطابق الجبر المنطقي (Boolean algebra): `and` تشبه الضرب و`or` تشبه الجمع.'
      8:
        what: 'بالأقواس معنى آخر: «في العطلة **و**(بلا مطر أو بتذكرة)» ← `False` لأنه ليس يوم عطلة. **الأقواس غيّرت القرار**.'
      10:
        what: '**سلسلة مقارنات (chaining)**: `0 < age < 30` تعني `0 < age and age < 30`، كما في الرياضيات.'
      11:
        what: '`==` تقارن **القيمة**: قائمتان بالمحتوى نفسه متساويتان: `True`.'
      12:
        what: '`is` تقارن **الهوية**: هل هما الـobject نفسه في الذاكرة؟ قائمتان منفصلتان، إذن `False`.'
        theory: كل literal `[1]` ينشئ object جديدًا. استعمل `is` تقريبًا مع `None` وحدها (`x is None`)، ولمقارنة القيم استعمل دائمًا `==`.
