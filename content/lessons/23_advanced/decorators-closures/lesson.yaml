  - "فهم أن الدوال objects: تُمرَّر وتُعاد وتُخزَّن."
  - "فهم الـclosure: دالة داخلية تتذكر متغيرات الدالة التي أنشأتها، ودور nonlocal."
  - "كتابة decorator يلف دالة ويضيف سلوكًا (توقيت، تسجيل، تحقق)."
  - "فهم أن @deco مجرد اختصار لـf = deco(f)، واستخدام functools.wraps."
