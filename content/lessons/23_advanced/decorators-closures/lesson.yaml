quizzes:
  q-closure:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      def make_multiplier(k):
          def multiply(x):
              return x * k
          return multiply

      double = make_multiplier(2)
      triple = make_multiplier(3)
      print(double(5), triple(5))
    options: ["`10 15`", "`15 15`", "`NameError: k`"]
    answer: 0
    explanation: |
      كل استدعاء لـ`make_multiplier` ينشئ دالة `multiply` جديدة **تتذكر** قيمة `k` الخاصة بها، حتى بعد
      انتهاء `make_multiplier`. هذا هو الـclosure.
  q-sugar:
    kind: concept
    question: "ما الذي يكافئ هذا الكود تمامًا؟\n```python\n@timer\ndef load(): ...\n```"
    options:
      - "`timer(load())`"
      - "`load = timer(load)`"
      - "`def load(): timer()`"
    answer: 1
    explanation: |
      الـ`@` **سكّر نحوي (syntactic sugar)**: بعد تعريف الدالة، يُستدعى الـdecorator عليها، ويُربط الاسم
      `load` بما أعاده، وهو عادة دالة غلاف (wrapper).
  q-exit:
    kind: exit
    question: "لماذا نضع `@functools.wraps(func)` على الدالة الداخلية؟"
    options:
      - "لتسريع التنفيذ"
      - "لتحتفظ الدالة المغلَّفة باسمها و docstring الأصليين بدل أن تصبح `wrapper`"
      - "لأنها إجبارية وإلا يرفع خطأ"
    answer: 1
    explanation: "بدون `wraps` يصبح `load.__name__ == 'wrapper'` ويضيع التوثيق، فتتشوش رسائل الأخطاء وأدوات التوثيق والاختبار."

exercises:
  ex-retry:
    title: "decorator للمحاولة من جديد"
    prompt: |
      اكتب decorator بمعامل: `retry(times)`. عند تغليف دالة:

      - يستدعيها، وإن رفعت `ValueError` يعيد المحاولة، حتى `times` محاولات إجمالًا.
      - إن نجحت يُعيد نتيجتها فورًا.
      - إن فشلت كل المحاولات يعيد رفع **آخر** `ValueError`.
      - يحافظ على اسم الدالة الأصلي (`functools.wraps`).

      الدالة `flaky` تفشل مرتين ثم تنجح، فيجب أن تنجح مع `@retry(3)`.
    starter: |
      import functools


      def retry(times):
          def decorator(func):
              def wrapper(*args, **kwargs):
                  return func(*args, **kwargs)
              return wrapper
          return decorator


      calls = {"n": 0}


      @retry(3)
      def flaky():
          """Fails twice, then works."""
          calls["n"] += 1
          if calls["n"] < 3:
              raise ValueError(f"attempt {calls['n']} failed")
          return "ok"


      print(flaky(), calls["n"], flaky.__name__)
    solution: |
      import functools


      def retry(times):
          def decorator(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  last_error = None
                  for _ in range(times):
                      try:
                          return func(*args, **kwargs)
                      except ValueError as exc:
                          last_error = exc
                  raise last_error
              return wrapper
          return decorator


      calls = {"n": 0}


      @retry(3)
      def flaky():
          """Fails twice, then works."""
          calls["n"] += 1
          if calls["n"] < 3:
              raise ValueError(f"attempt {calls['n']} failed")
          return "ok"


      print(flaky(), calls["n"], flaky.__name__)
    tests: |
      assert flaky.__name__ == "flaky", f"استخدم functools.wraps: الاسم الآن {flaky.__name__}"
      _count = {"n": 0}

      @retry(2)
      def _always_fails():
          _count["n"] += 1
          raise ValueError(f"boom {_count['n']}")

      try:
          _always_fails()
      except ValueError as _e:
          assert str(_e) == "boom 2", f"يجب إعادة رفع آخر خطأ، وجدت: {_e}"
      else:
          raise AssertionError("كان يجب أن يُرفع ValueError بعد نفاد المحاولات")
      assert _count["n"] == 2, f"يجب أن تكون المحاولات 2 بالضبط، وجدت {_count['n']}"

      @retry(5)
      def _add(a, b=0):
          return a + b

      assert _add(2, b=3) == 5, "مرّر *args و**kwargs إلى الدالة الأصلية"
    hints:
      - "ثلاث طبقات: `retry(times)` تعيد `decorator(func)` التي تعيد `wrapper(*args, **kwargs)`."
      - "داخل `wrapper`: حلقة `for _ in range(times)` فيها `try: return func(...)` و`except ValueError as exc: last_error = exc`."
      - "بعد الحلقة: `raise last_error`. وضع `@functools.wraps(func)` فوق `def wrapper`."

# --- step-by-step command animations ---
animations:
  anim-decorator:
    title: 'decorator تحت المجهر: من التعريف إلى الاستدعاء'
    code: |
      import functools


      def log_calls(func):
          @functools.wraps(func)
          def wrapper(*args):
              print("calling", func.__name__, args)
              result = func(*args)
              print("returned", result)
              return result

          return wrapper


      @log_calls
      def area(w, h):
          return w * h


      total = area(3, 4)
      print(total, area.__name__)
    notes:
      4:
        what: 'نعرّف **decorator**: دالة تأخذ دالة (`func`) وتعيد دالة جديدة. التعريف وحده لا ينفّذ جسمها.'
        theory: 'هذا ممكن لأن الدوال في Python **objects من الدرجة الأولى**: تُمرَّر كمعاملات، وتُعاد من دوال، وتُخزَّن في متغيرات. والدالة التي تأخذ دالة أو تعيدها تسمى **higher-order function**.'
      5:
        what: داخل الـdecorator ننشئ `wrapper`، و`functools.wraps` تنسخ إليها اسم الدالة الأصلية وتوثيقها (`__name__`، `__doc__`).
      7:
        what: 'سلوك يُضاف **قبل** الدالة الأصلية: نسجّل اسمها ومعاملاتها.'
        parts:
        - ['*args', 'يجمع كل المعاملات الموضعية في tuple: `(3, 4)`، فيعمل الـwrapper مع أي دالة']
        - [func.__name__, اسم الدالة الأصلية المحفوظة في الـclosure]
      8:
        what: 'نستدعي الدالة **الأصلية**، ونمرّر المعاملات كما وصلت: `*args` هنا تفكّ الـtuple إلى `3, 4`.'
      10:
        what: نعيد النتيجة إلى المستدعي. لو نسينا هذا السطر لأعادت `area` القيمة `None`!
      12:
        what: نعيد الدالة الداخلية **دون استدعائها** (بلا أقواس). وهي تحمل معها `func` في closure.
        theory: 'الـ**closure**: `wrapper` تتذكر `func` من نطاق `log_calls` حتى بعد انتهاء `log_calls` وإغلاق الـframe الخاص بها. القيمة محفوظة في «خلية» (cell) مرتبطة بالدالة: `area.__closure__[0].cell_contents`.'
      15:
        what: 'هنا تحدث الفكرة كلها: بعد إنشاء `area`، يستدعي Python فورًا `log_calls(area)` ويربط الاسم `area` **بما أعادته**.'
        parts:
        - ['@log_calls', اختصار لـ`area = log_calls(area)` بعد التعريف مباشرة]
        theory: 'الـ`@` مجرد **سكّر نحوي (syntactic sugar)**. بعد هذا السطر لم يعد الاسم `area` يشير إلى الدالة الأصلية بل إلى `wrapper`، والأصلية محفوظة داخل الـclosure باسم `func`. تابع الـcall stack: ستدخل الآن إلى `log_calls`.'
      17:
        what: الدالة الأصلية تعمل كما هي تمامًا، ولا تعرف أنها مغلّفة.
      20:
        what: 'نستدعي `area`... لكنها الآن `wrapper`! راقب الـcall stack: أولًا `wrapper(3, 4)`، ثم بداخلها `area` الأصلية.'
      21:
        what: '`area.__name__` تطبع `area` لا `wrapper`، بفضل `functools.wraps`.'
