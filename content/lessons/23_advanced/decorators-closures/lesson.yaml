id: decorators-closures
track: advanced
order: 1
title_ar: "Closures وDecorators: دوال تصنع دوالًا"
title_en: "Closures and decorators: functions that build functions"
level: advanced
estimated_minutes: 50
prerequisites: [scope-legb, iterators-generators]
objectives:
  - "فهم أن الدوال objects: تُمرَّر وتُعاد وتُخزَّن."
  - "فهم الـclosure: دالة داخلية تتذكر متغيرات الدالة التي أنشأتها، ودور nonlocal."
  - "كتابة decorator يلف دالة ويضيف سلوكًا (توقيت، تسجيل، تحقق)."
  - "فهم أن @deco مجرد اختصار لـf = deco(f)، واستخدام functools.wraps."
  - "كتابة decorator يأخذ معاملات، ومعرفة الجاهز منها: lru_cache وproperty وdataclass."
docs_url: "https://docs.python.org/3/glossary.html#term-decorator"
