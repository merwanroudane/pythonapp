id: numpy-arrays
track: numpy
order: 1
title_ar: "NumPy: المصفوفات والحساب المتجه (vectorization)"
title_en: "NumPy: arrays and vectorized computation"
level: intermediate
estimated_minutes: 50
prerequisites: [comprehensions]
objectives:
  - "فهم ndarray: بنية متجانسة لها shape وdtype، والفرق بينها وبين list."
  - "إنشاء arrays بـnp.array وarange وlinspace وzeros، وتغيير الشكل بـreshape."
  - "تطبيق العمليات elementwise دون حلقات (vectorization)."
  - "فهم الـbroadcasting بين أشكال مختلفة."
  - "التصفية بالأقنعة المنطقية، والتجميع على محور axis."
docs_url: "https://numpy.org/doc/stable/user/absolute_beginners.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [numpy, ndarray, shape, dtype, vectorization, broadcasting, mask, axis, reshape]

quizzes:
  q-list-vs-array:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      import numpy as np
      print([1, 2, 3] * 2)
      print(np.array([1, 2, 3]) * 2)
    options:
      - "`[2, 4, 6]` ثم `[2 4 6]`"
      - "`[1, 2, 3, 1, 2, 3]` ثم `[2 4 6]`"
      - "`[1, 2, 3, 1, 2, 3]` مرتين"
    answer: 1
    explanation: |
      `*` على list **تكرار** للقائمة. أما على ndarray فهي عملية **رياضية على كل عنصر**. هذا جوهر NumPy.
  q-axis:
    kind: predict
    question: "ما قيمة `m.sum(axis=0)`؟"
    code: |
      import numpy as np
      m = np.array([[1, 2, 3],
                    [4, 5, 6]])
      print(m.sum(axis=0), m.sum(axis=1))
    options: ["`[6 15] [5 7 9]`", "`[5 7 9] [6 15]`", "`21 21`"]
    answer: 1
    explanation: |
      `axis=0` يجمع **على طول الصفوف** (نزولًا) فيعطي مجموع كل **عمود**. `axis=1` يجمع على طول الأعمدة
      فيعطي مجموع كل **صف**. قاعدة: المحور المذكور هو الذي «يختفي» من الشكل.
  q-exit:
    kind: exit
    question: 'لماذا `np.array([1, "2", 3.0])` ليست فكرة جيدة؟'
    options:
      - "لأنها ترفع خطأ"
      - "لأن الـarray متجانسة، فتُحوَّل كل العناصر إلى نوع واحد (هنا نصوص) وتضيع الأرقام"
      - "لأن NumPy لا تقبل float"
    answer: 1
    explanation: |
      على عكس list، لكل ndarray **dtype واحد**. عند الخلط يختار NumPy نوعًا يسع الجميع، وهنا يصبح كل شيء
      نصًا فلا يمكن الحساب.

exercises:
  ex-standardize:
    title: "توحيد القياس (z-scores) بلا حلقات"
    prompt: |
      لديك درجات 5 طلاب في 3 مواد (مصفوفة 5 × 3). دون أي حلقة `for`:

      - `col_means`: متوسط كل **مادة** (عمود) ← shape `(3,)`.
      - `z`: الـz-score لكل خلية: `(x - متوسط العمود) / انحراف العمود المعياري` (استخدم `std(axis=0)`).
      - `top_mask`: قناع منطقي للخلايا التي `z > 1`.
      - `n_top`: عدد هذه الخلايا.
    starter: |
      import numpy as np

      scores = np.array([
          [12, 15, 9],
          [14, 11, 16],
          [18, 13, 12],
          [10, 17, 14],
          [16, 14, 19],
      ], dtype=float)

      col_means = ...
      z = ...
      top_mask = ...
      n_top = ...

      print(col_means, n_top)
    solution: |
      import numpy as np

      scores = np.array([
          [12, 15, 9],
          [14, 11, 16],
          [18, 13, 12],
          [10, 17, 14],
          [16, 14, 19],
      ], dtype=float)

      col_means = scores.mean(axis=0)
      z = (scores - col_means) / scores.std(axis=0)
      top_mask = z > 1
      n_top = int(top_mask.sum())

      print(col_means, n_top)
    tests: |
      import numpy as _np
      assert col_means.shape == (3,), f"col_means يجب أن يكون shape (3,) وليس {getattr(col_means, 'shape', None)}"
      assert _np.allclose(col_means, [14.0, 14.0, 14.0])
      assert z.shape == (5, 3), "z يجب أن يكون بنفس شكل scores"
      assert _np.allclose(z.mean(axis=0), 0) and _np.allclose(z.std(axis=0), 1), "أعمدة z يجب أن يكون متوسطها 0 وانحرافها 1"
      assert top_mask.dtype == bool and n_top == 3, f"n_top يجب أن يكون 3 وليس {n_top}"
    hints:
      - "`scores.mean(axis=0)` متوسط كل عمود. والطرح `scores - col_means` يعمل بالـbroadcasting."
      - "`z = (scores - col_means) / scores.std(axis=0)`، ثم المقارنة `z > 1` تُعيد مصفوفة bool."
      - "`n_top = int(top_mask.sum())` لأن True تُحسب 1."

# --- step-by-step command animations ---
animations:
  anim-numpy:
    title: 'من قائمة إلى مصفوفة: axis وbroadcasting والأقنعة'
    code: |
      import numpy as np

      scores = np.array([[12, 15, 9],
                         [14, 11, 16],
                         [18, 13, 12]])
      col_means = scores.mean(axis=0)
      centered = scores - col_means
      above = centered > 0
      n_above = above.sum()
      best = scores[above]
      doubled = scores * 2
      print(col_means.round(2), n_above, best)
    notes:
      3:
        what: '`np.array` تحوّل قائمة قوائم إلى **ndarray** ثنائي الأبعاد: 3 صفوف × 3 أعمدة، كل عناصره من نوع واحد.'
        parts:
        - [np.array(...), يبني مصفوفة من أي تسلسل متداخل]
        - ['[[...], [...], [...]]', كل قائمة داخلية تصبح **صفًا**]
        theory: 'القائمة `list` تخزّن **مراجع** إلى objects متفرقة في الذاكرة. أما ndarray فتخزّن الأرقام **خامًا ومتجاورة** في كتلة واحدة، مع وصف صغير: `shape=(3, 3)` و`dtype=int64`. هذا التنظيم هو ما يسمح بالحساب عليها بكود C مُصرَّف دفعة واحدة.'
      6:
        what: 'متوسط كل **عمود**: `axis=0` تعني «اطوِ بُعد الصفوف»، فيبقى shape `(3,)`: قيمة لكل عمود.'
        parts:
        - [scores.mean, method إحصائية على المصفوفة]
        - [axis=0, 'المحور الذي **يختفي**: الصفوف']
        theory: 'قاعدة المحور: المحور المذكور هو الذي يختفي من الشكل. `(3, 3)` مع `axis=0` ← `(3,)` لكل عمود؛ ومع `axis=1` ← `(3,)` لكل صف؛ وبلا `axis` ← رقم واحد للمصفوفة كلها.'
      7:
        what: 'نطرح متوسط كل عمود من عناصره **بلا أي حلقة**: هذا هو الـbroadcasting.'
        parts:
        - [scores, 'shape `(3, 3)`']
        - [col_means, 'shape `(3,)`، تُعامل كـ`(1, 3)` ثم تُمدَّد على الصفوف الثلاثة']
        theory: 'تقارن NumPy الأشكال **من اليمين**: 3 مع 3 متساويان، والبعد الناقص يُعتبر 1 فيُمدَّد. ولا تُنسخ `col_means` فعليًا ثلاث مرات؛ الحلقة تجري داخل C وتعيد استعمال الصف نفسه.'
      8:
        what: 'المقارنة أيضًا عنصرًا بعنصر: النتيجة **قناع منطقي** بالشكل نفسه، فيه `True` حيث القيمة أعلى من متوسط عمودها.'
      9:
        what: 'جمع قيم منطقية: `True` تُحسب 1 و`False` تُحسب 0، فالمجموع هو **عدد** الخلايا الصحيحة.'
      10:
        what: الفهرسة بالقناع تختار العناصر حيث `True` فقط، وتعيد مصفوفة **أحادية البعد**.
        theory: 'الفهرسة المنطقية (boolean indexing) تعيد **نسخة** جديدة، أما slicing مثل `scores[:2]` فيعيد **view** يشارك الذاكرة نفسها: تعديل الـview يعدّل الأصل. فرق مهم عند الكتابة.'
      11:
        what: '`*` على ndarray ضرب رياضي لكل عنصر. (على `list` كانت ستكرر القائمة مرتين.)'
