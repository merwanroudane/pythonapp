id: strings-quotes-escapes
track: syntax
order: 2
title_ar: "النصوص: علامات التنصيص والـescape sequences"
title_en: "Strings: quotes, escape sequences & raw strings"
level: beginner
estimated_minutes: 30
prerequisites: [first-line-print]
objectives:
  - "إنشاء strings بعلامات تنصيص مفردة ومزدوجة وثلاثية ومتى نستخدم كلًّا منها."
  - "فهم escape sequences مثل \\n و\\t و\\\\."
  - "التمييز بين ما يعرضه print وما يعرضه repr."
  - "استخدام raw strings ومعرفة حدودها."
docs_url: "https://docs.python.org/3/reference/lexical_analysis.html#string-and-bytes-literals"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [str, quotes, escape, repr, raw string, SyntaxError]

quizzes:
  q-len:
    kind: predict
    question: "كم تساوي `len(s)`؟"
    code: |
      s = "a\nb"
      print(len(s))
    options: ["4", "3", "2"]
    answer: 1
    explanation: |
      `\n` حرفان في **الكود المصدري** لكنها **حرف واحد** (newline) داخل الـstring.
      إذن: `a` + newline + `b` = 3 حروف.
  q-exit:
    kind: exit
    question: "أي literal يعطي النص `It's \"ok\"` بلا أخطاء؟"
    options:
      - "`'It's \"ok\"'`"
      - "`\"It's \\\"ok\\\"\"`"
      - "`\"It's \"ok\"\"`"
    answer: 1
    explanation: |
      الخيار الأول ينتهي عند `It` لأن `'` تغلق النص. الثالث يغلق النص قبل `ok`.
      الثاني يستخدم علامات مزدوجة للخارج ويهرّب العلامات المزدوجة الداخلية بـ`\"`.
      بديل أوضح: `'''It's "ok"'''`.

exercises:
  ex-quote:
    title: "نص يحتوي النوعين من علامات التنصيص"
    prompt: |
      أنشئ المتغير `sentence` بحيث تكون قيمته **بالضبط**:

      ```text
      She said "it's fine"
      ```

      ثم أنشئ `two_lines` بحيث إذا طُبع يظهر `first` في سطر و`second` في السطر التالي،
      مستخدمًا escape sequence وليس triple quotes.
    starter: |
      sentence = ...
      two_lines = ...

      print(sentence)
      print(two_lines)
    solution: |
      sentence = "She said \"it's fine\""
      two_lines = "first\nsecond"

      print(sentence)
      print(two_lines)
    tests: |
      assert sentence == 'She said "it' + "'" + 's fine"', "راجع علامات التنصيص والمسافات في sentence"
      assert two_lines == "first" + chr(10) + "second", "two_lines يجب أن تحوي newline واحدة بين الكلمتين"
    hints:
      - "النص يحتوي `'` و`\"` معًا؛ اختر علامة خارجية ثم هرّب الأخرى داخلها."
      - "داخل نص محاط بـ`\"...\"` اكتب `\\\"` للعلامة المزدوجة. والسطر الجديد هو `\\n`."
      - "`sentence = \"She said \\\"it's fine\\\"\"`"

changes:
  ch-print-repr:
    title: "print مقابل repr"
    base: |
      s = "Tab:\there\nNew line"
      print(s)
    base_label: "قبل · print (للبشر)"
    variants:
      - label: "repr (للمبرمج)"
        code: |
          s = "Tab:\there\nNew line"
          print(repr(s))
        explain: "`repr` يعرض الـstring كما تُكتب في الكود، بعلامات التنصيص وescape sequences ظاهرة. هذا ما تراه في Notebook وفي الـVariable Inspector."
      - label: "raw string"
        code: |
          s = r"Tab:\there\nNew line"
          print(s)
        explain: "مع `r` لا تُفسَّر `\\t` و`\\n`؛ تبقى الشرطة العكسية حرفًا عاديًا. مفيد للمسارات والـregex."

# --- step-by-step command animations ---
animations:
  anim-strings:
    title: المحددات وتسلسلات الهروب والـraw strings
    code: |
      a = 'single'
      b = "it's fine"
      c = 'She said "hi"'
      d = "tab:\there"
      e = "line1\nline2"
      path = r"C:\new\table"
      length = len(e)
      shown = repr(d)
      print(d)
      print(e)
      print(path, length, shown)
    notes:
      1:
        what: '**string literal** بعلامتي تنصيص مفردتين. القيمة نفسها لو استعملنا مزدوجتين: الاختيار مسألة راحة.'
      2:
        what: النص يحتوي `'`، فنحدده بـ`"` كي لا يُفهم أنه نهاية النص.
        theory: 'المحدِّد (delimiter) يخبر الـtokenizer أين يبدأ النص وأين ينتهي. إن ظهر المحدِّد نفسه داخل النص ظنّه نهاية النص فيقع SyntaxError. الحلول: محدِّد آخر، أو الهروب `\''`، أو علامات ثلاثية `"""`.'
      3:
        what: 'العكس: النص فيه `"` فنحدده بـ`''`.'
      4:
        what: '`\t` **تسلسل هروب (escape sequence)**: حرفان في الكود، لكنهما **حرف واحد** في القيمة هو حرف الجدولة (tab).'
        parts:
        - [\, 'حرف الهروب: «الحرف التالي له معنى خاص»']
        - [\t, tab]
        - [\n, سطر جديد]
        theory: بعض الحروف لا تُكتب مباشرة أو لا تُرى (سطر جديد، tab). الهروب يمثّلها بحروف مرئية. لذلك `len("\t")` تساوي 1 لا 2.
      5:
        what: '`\n` داخل النص يعني أن القيمة فيها حرف سطر جديد، فتُطبع على سطرين.'
      6:
        what: '**raw string** (حرف `r` قبل النص): الـ`\` يبقى حرفًا عاديًا. مفيد لمسارات Windows ولأنماط regex.'
        theory: 'بدون `r` يصبح `\n` في `C:\new` سطرًا جديدًا، و`\t` في `\table` حرف tab! والنتيجة مسار خاطئ **بصمت**. والأفضل للمسارات: `/` أو `pathlib`.'
      7:
        what: '`len` يعدّ **الحروف في القيمة**: `line1` (5) + سطر جديد (1) + `line2` (5) = 11، لا عدد ما كتبته في الكود.'
      8:
        what: '`repr` تعطي تمثيل النص **كما يُكتب في الكود** والهروب ظاهر، وهذا ما يعرضه notebook والـdebugger. أما `print` فتعرض القيمة نفسها.'
