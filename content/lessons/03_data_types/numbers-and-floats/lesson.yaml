id: numbers-and-floats
track: data_types
order: 3
title_ar: "الأرقام: int وfloat ولماذا 0.1 + 0.2 ≠ 0.3"
title_en: "Numbers: int, float, and why 0.1 + 0.2 != 0.3"
level: beginner
estimated_minutes: 30
prerequisites: [data-types-map]
objectives:
  - "التمييز بين int وfloat ومتى ينتج كل منهما."
  - "فهم الفرق بين / و// و%."
  - "فهم لماذا لا تكون عمليات float دقيقة تمامًا، ومقارنتها بـmath.isclose."
  - "التحويل بين النصوص والأرقام وتوقّع ValueError."
docs_url: "https://docs.python.org/3/tutorial/floatingpoint.html"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [int, float, division, isclose, round, casting, ValueError]

quizzes:
  q-float:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      print(0.1 + 0.2 == 0.3)
    options: ["`True`", "`False`", "`TypeError`"]
    answer: 1
    explanation: |
      `0.1` و`0.2` لا يمكن تمثيلهما بدقة في النظام الثنائي، فمجموعهما في الذاكرة هو
      `0.30000000000000004`. للمقارنة استخدم `math.isclose(0.1 + 0.2, 0.3)`.
  q-div:
    kind: predict
    question: "ما قيمة `7 / 2` و`7 // 2` و`7 % 2` بالترتيب؟"
    options: ["`3 3 1`", "`3.5 3 1`", "`3.5 3.5 1`"]
    answer: 1
    explanation: |
      `/` قسمة حقيقية تُنتج `float` دائمًا (حتى `4 / 2` = `2.0`). `//` قسمة صحيحة
      (floor division) و`%` باقي القسمة.
  q-exit:
    kind: exit
    question: "ماذا يعطي `int(\"3.7\")`؟"
    options: ["`3`", "`4`", "`ValueError`"]
    answer: 2
    explanation: |
      `int()` على **نص** يتطلب نصًا يمثل عددًا صحيحًا. للنص `"3.7"` حوّله أولًا:
      `int(float("3.7"))` = `3` (القطع نحو الصفر، لا التقريب).

exercises:
  ex-prices:
    title: "اجمع أسعارًا جاءت كنصوص"
    prompt: |
      الأسعار وصلت من ملف كنصوص. احسب:

      - `total`: مجموعها كـ`float`، مقرّبًا إلى منزلتين عشريتين بـ`round`.
      - `matches`: هل `total` يساوي `31.35`؟ استخدم `math.isclose` وليس `==`.
    starter: |
      import math

      prices = ["10.10", "10.20", "11.05"]

      total = ...
      matches = ...

      print(total, matches)
    solution: |
      import math

      prices = ["10.10", "10.20", "11.05"]

      total = round(float(prices[0]) + float(prices[1]) + float(prices[2]), 2)
      matches = math.isclose(total, 31.35)

      print(total, matches)
    tests: |
      import math as _m
      assert isinstance(total, float), f"total يجب أن يكون float وليس {type(total).__name__}"
      assert _m.isclose(total, 31.35), f"total يجب أن يكون 31.35 وليس {total}"
      assert matches is True, "matches يجب أن يكون True"
    hints:
      - "`\"10.10\" + \"10.20\"` يلصق النصوص. حوّل كل نص إلى رقم أولًا."
      - "`float(prices[0])` يحوّل النص الأول؛ ثم `round(..., 2)` و`math.isclose(a, b)`."
      - "`total = round(float(prices[0]) + float(prices[1]) + float(prices[2]), 2)`"

changes:
  ch-compare:
    title: "كيف نقارن float؟"
    base: |
      a = 0.1 + 0.2
      print(a)
      print(a == 0.3)
    base_label: "قبل · =="
    variants:
      - label: "math.isclose"
        code: |
          import math
          a = 0.1 + 0.2
          print(a)
          print(math.isclose(a, 0.3))
        explain: "`isclose` تقارن ضمن هامش خطأ نسبي صغير، وهي الطريقة الصحيحة لمقارنة أعداد float."
      - label: "round للعرض"
        code: |
          a = 0.1 + 0.2
          print(round(a, 2))
          print(f"{a:.2f}")
        explain: "التقريب مناسب **للعرض**؛ القيمة الداخلية ما زالت `0.30000000000000004`. لا تعتمد على round لتصحيح المقارنات."
      - label: "Decimal"
        code: |
          from decimal import Decimal
          a = Decimal("0.1") + Decimal("0.2")
          print(a)
          print(a == Decimal("0.3"))
        explain: "`Decimal` يمثل الكسور العشرية بدقة، وهو مفيد للمبالغ المالية. لاحظ أننا أنشأناه من **نصوص**، لا من float."

# --- step-by-step command animations ---
animations:
  anim-floats:
    title: int الدقيق وfloat التقريبي
    code: |
      import math
      from decimal import Decimal

      a = 7 // 2
      b = 7 / 2
      c = 7 % 2
      big = 2 ** 100
      s = 0.1 + 0.2
      equal = s == 0.3
      close = math.isclose(s, 0.3)
      exact = Decimal("0.1") + Decimal("0.2")
      rounded = round(2.675, 2)
      as_int = int("42") + int(3.99)
      print(a, b, c, s, equal, close, exact, rounded, as_int)
      print(big)
    notes:
      4:
        what: '`//` **قسمة صحيحة (floor division)**: الناتج مقرَّب إلى الأسفل، والنوع `int`: 3.'
        theory: 'في Python عاملا قسمة: `/` تعطي **دائمًا** float (حتى `4 / 2` = `2.0`)، و`//` تعطي الجزء الصحيح بالتقريب نحو −∞، لذلك `-7 // 2` = `-4` لا `-3`.'
      5:
        what: '`/` قسمة حقيقية: `3.5` من نوع float.'
      6:
        what: '`%` **باقي القسمة (modulo)**: 1. مفيد لفحص الزوجية `n % 2 == 0` وللدوران في دورة.'
      7:
        what: '`**` الأس. والنتيجة عدد صحيح من 31 رقمًا بلا أي فقد: `int` في Python **دقيق وغير محدود الحجم**.'
        theory: 'الـ`int` يكبر في الذاكرة حسب الحاجة (arbitrary precision)، على عكس لغات كثيرة يفيض فيها بعد 2⁶³. أما `float` فحجمه ثابت: 64 bit حسب معيار **IEEE 754**.'
      8:
        what: النتيجة `0.30000000000000004` لا `0.3`!
        theory: الـfloat يخزّن العدد **بالنظام الثنائي**. و0.1 في الثنائي كسر لا ينتهي، مثل 1/3 = 0.333… في العشري، فيُقطع ويُخزَّن أقرب قيمة ممكنة، ويظهر الخطأ الصغير عند الجمع. هذا ليس خللًا في Python بل في تمثيل كل الحواسيب تقريبًا.
      9:
        what: 'لذلك المساواة التامة بين floats خطرة: `False`.'
      10:
        what: 'المقارنة الصحيحة: «قريبان بما يكفي» ضمن سماحية نسبية، فالنتيجة `True`.'
      11:
        what: '`Decimal` يخزّن الأرقام **بالنظام العشري** فيجمع 0.1 و0.2 بدقة: `0.3`. مناسب للمال والمحاسبة.'
        parts:
        - [Decimal("0.1"), من **نص**، لتفادي خطأ الـfloat من البداية]
        - [Decimal(0.1), (تجنّبه) يرث خطأ الـfloat كما هو]
      12:
        what: 'مفاجأة: `2.67` لا `2.68`، لأن 2.675 مخزّن فعليًا كـ2.67499999…'
      13:
        what: 'التحويل (casting): `int("42")` من نص إلى رقم، و`int(3.99)` **يقطع** الكسر فيعطي 3 ولا يقرّب.'
