id: strings-methods-fstrings
track: data_types
order: 7
title_ar: "النصوص في العمل: indexing وslicing والـmethods وf-strings"
title_en: "Working with strings: indexing, slicing, methods & f-strings"
level: beginner
estimated_minutes: 40
prerequisites: [none-type]
objectives:
  - "الوصول إلى الحروف بالـindex الموجب والسالب، واقتطاع أجزاء بالـslicing."
  - "فهم أن str immutable: كل method تُعيد نصًا جديدًا."
  - "اختيار الـmethod المناسبة حسب المهمة: تنظيف، بحث، استبدال، تقسيم ودمج."
  - "تنسيق الأرقام والنصوص بـf-strings: المنازل العشرية، العرض، المحاذاة، الفواصل."
docs_url: "https://docs.python.org/3/library/stdtypes.html#string-methods"
last_verified: "2026-09-24"
python_min: "3.11"
tags: [str, index, slice, strip, split, join, replace, f-string, format]

quizzes:
  q-slice:
    kind: predict
    question: "ماذا يطبع؟"
    code: |
      s = "Python"
      print(s[1:4], s[-1], s[::-1])
    options:
      - "`Pyth n nohtyP`"
      - "`yth n nohtyP`"
      - "`yth P Python`"
    answer: 1
    explanation: |
      `s[1:4]` من الموضع 1 حتى **قبل** 4: `y t h`. و`s[-1]` آخر حرف. و`s[::-1]` خطوة -1:
      النص معكوسًا.
  q-upper:
    kind: predict
    question: "ما قيمة `name` بعد التنفيذ؟"
    code: |
      name = "sara"
      name.upper()
      print(name)
    options: ["`SARA`", "`sara`", "`None`"]
    answer: 1
    explanation: |
      النصوص **immutable**. `upper()` أعادت نصًا جديدًا `"SARA"` لكن لم يُخزّنه أحد.
      الصحيح: `name = name.upper()`.
  q-exit:
    kind: exit
    question: "أي f-string يعطي `  3.14` (عرض 6، منزلتان عشريتان)؟"
    options: ["`f\"{pi:6.2f}\"`", "`f\"{pi:.6f}\"`", "`f\"{pi:2.6f}\"`"]
    answer: 0
    explanation: "في `6.2f` الرقم 6 هو **العرض الكلي** و`.2` عدد المنازل العشرية و`f` تعني fixed-point."

exercises:
  ex-clean:
    title: "نظّف الاسم وأنشئ سطر تقرير"
    prompt: |
      1. نظّف `raw` لينتج `name` بالشكل `"Sara Ahmed"`: بلا مسافات زائدة في الطرفين،
         وكل كلمة تبدأ بحرف كبير.
      2. أنشئ `line` بـf-string بحيث يكون الاسم محاذى لليسار في عرض 12، ثم الدرجة
         بعرض 6 ومنزلة عشرية واحدة. النتيجة المتوقعة: `"Sara Ahmed    17.5"`.
    starter: |
      raw = "   sara AHMED  "
      score = 17.456

      name = ...
      line = ...

      print(repr(name))
      print(repr(line))
    solution: |
      raw = "   sara AHMED  "
      score = 17.456

      name = raw.strip().title()
      line = f"{name:<12}{score:6.1f}"

      print(repr(name))
      print(repr(line))
    tests: |
      assert name == "Sara Ahmed", f"name يجب أن يكون 'Sara Ahmed' وليس {name!r}"
      assert line == "Sara Ahmed    17.5", f"line غير مطابق: {line!r}"
    hints:
      - "تنظيف الطرفين method، وتكبير أول حرف من كل كلمة method أخرى. يمكن ربطهما بنقطة."
      - "`raw.strip().title()`. وفي f-string: `:<12` محاذاة يسار بعرض 12، و`:6.1f` للرقم."
      - "`line = f\"{name:<12}{score:6.1f}\"`"

changes:
  ch-format:
    title: "Format spec داخل f-string"
    base: |
      x = 1234567.8912
      print(f"{x}")
    base_label: "قبل · بلا تنسيق"
    variants:
      - label: ":.2f"
        code: |
          x = 1234567.8912
          print(f"{x:.2f}")
        explain: "`.2f` = منزلتان عشريتان بتقريب fixed-point."
      - label: ":,.2f"
        code: |
          x = 1234567.8912
          print(f"{x:,.2f}")
        explain: "الفاصلة `,` تضيف فاصل الآلاف. التنسيق يُنتج **نصًا**؛ القيمة الأصلية لم تتغير."
      - label: ":>15.1f"
        code: |
          x = 1234567.8912
          print(f"[{x:>15.1f}]")
        explain: "`>15` محاذاة لليمين داخل عرض 15 حرفًا. الأقواس المربعة فقط لإظهار العرض."
      - label: ":.1%"
        code: |
          ratio = 0.4567
          print(f"{ratio:.1%}")
        explain: "`%` يضرب في 100 ويضيف علامة النسبة: مثالي لنتائج الاستبيانات والنسب."

# --- step-by-step command animations ---
animations:
  anim-strmethods:
    title: تنظيف نص وتنسيقه، method بعد method
    code: |
      raw = "  Sara BENALI  "
      clean = raw.strip()
      title = clean.title()
      first = clean[0]
      last_name = clean.split()[1]
      unchanged = raw
      words = "data,science,python".split(",")
      joined = " | ".join(words)
      found = joined.find("python")
      price = 1234.5
      label = f"{title}: {price:,.2f} DZD ({len(words)} tags)"
      print(label)
    notes:
      1:
        what: 'نص فيه مسافات زائدة وحالة أحرف غير موحدة: هكذا تبدو البيانات الحقيقية.'
      2:
        what: '`strip()` تعيد نصًا **جديدًا** بلا مسافات في الطرفين، و`raw` نفسه لم يتغير.'
        theory: 'الـstr **immutable**: لا method تعدّل النص في مكانه، كلها تعيد نصًا جديدًا. لذلك يجب الإسناد: `s = s.strip()`. أما كتابة `s.strip()` وحدها فلا تغيّر شيئًا.'
      3:
        what: '`title()` تجعل أول حرف من كل كلمة كبيرًا والباقي صغيرًا: `Sara Benali`.'
      4:
        what: 'الفهرسة: النص **تسلسل** حروف، أولها في الموضع 0.'
        parts:
        - ['clean[0]', أول حرف]
        - ['clean[-1]', (للمقارنة) آخر حرف]
      5:
        what: '`split()` تقسم على المسافات إلى `[''Sara'', ''BENALI'']`، ثم `[1]` تأخذ العنصر الثاني.'
        theory: 'هذا **تسلسل عمليات (chaining)**: كل خطوة تعيد قيمة نطبق عليها التالية. اقرأها من اليسار إلى اليمين.'
      6:
        what: 'الدليل: `raw` ما زال كما هو بمسافاته، بعد كل تلك العمليات.'
      7:
        what: '`split(",")` بفاصل محدد: سطر CSV بسيط ← قائمة نصوص.'
      8:
        what: '`join` العكس: يلصق عناصر قائمة نصوص بفاصل. لاحظ أن الفاصل هو الـobject: `" | ".join(words)`.'
      9:
        what: '`find` تعيد موضع أول ظهور، أو `-1` إن لم يوجد.'
      11:
        what: '**f-string**: كل `{expression}` يُحسب ويُدرج في النص، وبعد `:` تأتي **مواصفة تنسيق** تتحكم في الشكل.'
        parts:
        - ['{title}', قيمة متغير]
        - ['{price:,.2f}', '`,` فاصل الآلاف و`.2f` رقمان بعد الفاصلة: `1,234.50`']
        - ['{len(words)}', أي expression، حتى استدعاء دالة]
        theory: 'التنسيق **للعرض فقط**: `f"{x:.2f}"` نص، والقيمة `x` لم تتغير. احسب بالأرقام، ونسّق في النهاية عند العرض.'
