[project]
name = "python-learning-lab"
version = "0.1.0"
description = "Arabic-first interactive platform for learning Python (Streamlit)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
dependencies = [
  "streamlit>=1.57",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
scientific = [
  "numpy",
  "pandas",
  "matplotlib",
]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lesson snippets are laid out by authors for teaching (aligned comments etc.).
extend-exclude = ["content"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
